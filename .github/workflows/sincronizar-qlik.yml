# Robô do Hub Comercial: lê os clientes no Qlik Sense e grava no Firebase (coleções hub_*).
# As chaves ficam em Settings › Secrets and variables › Actions, nunca no código.
name: Sincronizar Qlik

on:
  schedule:
    # De hora em hora no horário comercial: 7h15 às 19h15 de Brasília, segunda a sexta
    # (o GitHub usa UTC: 10h15 às 22h15). Fora disso não há pedido novo e o robô não gasta a cota do Firebase.
    - cron: "15 10-22 * * 1-5"
    # Dia 1 de cada mês às 7h15, mesmo em fim de semana: fecha o mês anterior e levanta a base fixa
    # de clientes que inativam no mês (meta de recuperação de 70%).
    - cron: "15 10 1 * *"
  workflow_dispatch: # botão "Run workflow" na aba Actions
    inputs:
      simular:
        description: "Só simular: lê o Qlik e mostra no log o que faria, sem gravar nada"
        type: boolean
        default: false
      reconhecer:
        description: "Só reconhecimento: lista pastas, objetos e campos do app do Qlik"
        type: boolean
        default: false

concurrency:
  group: sincronizar-qlik
  cancel-in-progress: false

jobs:
  sync:
    # Qlik só na rede da empresa? Crie a variável RUNNER = self-hosted e instale um runner numa máquina interna.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sincronizar
        run: node sync/index.js ${{ inputs.simular && '--dry-run' || '' }} ${{ inputs.reconhecer && '--reconhecer' || '' }}
        env:
          TZ: America/Sao_Paulo
          QLIK_HOST: ${{ secrets.QLIK_HOST }}
          QLIK_APP_ID: ${{ secrets.QLIK_APP_ID }}
          QLIK_OBJECT_ID: ${{ secrets.QLIK_OBJECT_ID }}
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
          QLIK_VIRTUAL_PROXY: ${{ vars.QLIK_VIRTUAL_PROXY }}
          QLIK_REJECT_UNAUTHORIZED: ${{ vars.QLIK_REJECT_UNAUTHORIZED || 'true' }}
          # Pedidos ficam no mesmo app "Vendas Dellamed SAP"; a variável só é preciso se um dia mudarem de app.
          QLIK_PEDIDOS_APP_ID: ${{ vars.QLIK_PEDIDOS_APP_ID || secrets.QLIK_APP_ID }}
          # Pipeline de Retenção (somente leitura): meses a copiar para o Hub. Variable PIPELINE_MESES muda a lista.
          PIPELINE_MESES: ${{ vars.PIPELINE_MESES || '2026-09,2026-10' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
