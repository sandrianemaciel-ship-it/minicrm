      <div class="ger-cen-d ${c.dif>=0?"ok":"neg"}">${c.dif>=0?`Excedente de ${money(c.dif)}`:`Faltam ${money(-c.dif)} · ≈ ${nInt(c.faltaN)} novos ou ${nInt(c.faltaR)} reativações a mais`}</div>
    </div>`).join("")}</div>
    <p class="hint">Valores padrão: novos = 1%, 2% e 4% dos clientes ativos; reativações = 2%, 4% e 8% dos inativos da carteira. Ticket usado: novos ${money(tNovo)}, reativação ${money(tReat)}.</p>
  </section>`;
  return h;
}
// Campos dos simuladores: só mudam a memória da tela (S.ger) e redesenham.
function gerChange(el){
  const G = gerS(); const k = el.dataset.ger; const raw = el.value; const v = raw==="" ? null : Number(raw);
  if(["time","vend","ref","met","dist"].includes(k)){ G[k] = raw; if(k==="time") G.vend = ""; if(k==="met"){ G.tNovo = null; G.tReat = null; } }
  else if(k.startsWith("gVend:")){ const id = k.slice(6); if(v==null) delete G.gVend[id]; else G.gVend[id] = v; }
  else if(k.startsWith("gCli:")){ const id = k.slice(5); if(v==null) delete G.gCli[id]; else G.gCli[id] = v; }
  else if(k.startsWith("cen:")){ const [,c,f] = k.split(":"); G.cen[c][f] = v==null ? (f==="g" ? 0 : null) : Math.max(0, v); }
  else if(k==="mixN"){ G.mixN = Math.max(0, Math.min(100, v==null?50:v)); }
  else if(k==="meta"||k==="tNovo"||k==="tReat"){ G[k] = v==null ? null : Math.max(0, v); }
  else G[k] = v==null ? 0 : v;
  render();
}

/* ---------- Pipeline ---------- */
function stripStats(pk, list){
  const P = PIPES[pk];
  const won = list.filter(i=>stageOf(pk,i.stage).end==="won");
  const lost = list.filter(i=>stageOf(pk,i.stage).end==="lost");
  const open = list.length - won.length - lost.length;
  const late = list.filter(i=>i.prox && pd(i.prox)<TODAY && !stageOf(pk,i.stage).end).length;
  const val = won.reduce((a,i)=>a+(i.valor||0),0);
  const s = [];
  if(pk==="carteira"){
    const n = t => list.filter(c=>c.pipe===t);
    s.push(["Clientes no filtro", list.length, "da carteira de clientes"]);
    s.push(["Ativos", n("ativo").length, "compra nos últimos 89 dias"]);
    s.push(["Inativariam no mês", n("risco").length, "inativação em "+MONTH_LABEL]);
    s.push(["Inativos", n("inativo").length, "90 dias ou mais sem compra"]);
    s.push(["Ganho", won.length, moneyK(val)+" em pedidos"]);
  }else if(pk==="ativos"){
    s.push(["Clientes ativos", list.length, "na carteira"]);
    s.push(["Pedido no mês", won.length, pct(won.length,list.length)+"% da carteira"]);
    s.push(["Valor dos pedidos", moneyK(val), MONTH_LABEL]);
    s.push(["Perto de 90 dias", list.filter(c=>days(TODAY,pd(c.dtUltFat))>=60).length, "60 a 89 dias sem compra"]);
  }else if(pk==="risco"){
    s.push(["Inativam no mês", list.length, MONTH_LABEL]);
    s.push(["Recuperados", won.length, pct(won.length,list.length)+"% de recuperação"]);
    s.push(["Valor recuperado", moneyK(val), "pedidos fechados"]);
    s.push(["Já inativaram", list.filter(c=>c.stage==="inativado").length, "sem contato ainda"]);
  }else if(pk==="inativos"){
    s.push(["Inativos", list.length, "90 dias ou mais sem compra"]);
    s.push(["Em trabalho", open - list.filter(c=>c.stage==="inativo").length, "com algum contato"]);
    s.push(["Reativados", won.length, pct(won.length,list.length)+"% da base"]);
    s.push(["Valor reativado", moneyK(val), "pedidos fechados"]);
  }else{
    s.push(["Leads abertos", open, list.length+" no total"]);
    s.push(["Sem responsável", list.filter(l=>!l.owner && !stageOf(pk,l.stage).end).length, "aguardando atribuição"]);
    s.push(["Primeiros pedidos", won.length, pct(won.length,list.length)+"% de conversão"]);
    s.push(["Valor dos 1ºs pedidos", moneyK(val), "leads convertidos"]);
  }
  s.push(["Contatos atrasados", late, "próximo contato vencido"]);
  return `<div class="strip">${s.map(([k,v,sub])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`).join("")}</div>`;
}

  }
  let h = `<div class="view-head"><div><h1>${P.label}</h1><p>${esc(P.desc)}</p></div><div class="actions">${actions}</div></div>`;
  if(pk==="carteira") h += renderMetasMes();

}

function cardBadges(pk, it){
  const b = [];
  if(pk==="carteira"){ pk = pipeKeyOfClient(it); b.push(`<span class="chip" style="background:var(--surface-2);color:var(--ink)"><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${CART[pk].c};margin-right:5px"></i>${CART[pk].sl}</span>`); }
  const st = stageOf(pk, it.stage);
  if(pk==="ativos"){
    const d = days(TODAY, pd(it.dtUltFat)); const ate = days(pd(it.dtInat), TODAY);
    b.push(`<span class="chip">${d} dias sem comprar</span>`);
    if(d>=60) b.push(`<span class="chip warn">faltam ${90-d} dias para 90</span>`);
  }else if(pk==="risco"){
    const ate = days(pd(it.dtInat), TODAY);
    if(st.end==="won") b.push(`<span class="chip good">recuperado</span>`);
    else if(ate>0) b.push(`<span class="chip warn">inativa em ${ate} ${ate===1?"dia":"dias"} · ${fdShort(it.dtInat)}</span>`);
    else b.push(`<span class="chip bad">inativou em ${fdShort(it.dtInat)}</span>`);
    if(it.stage==="carteira") b.push(`<span class="chip">${subEtapaRisco(it)}</span>`);
    if(it.pedidoId && it.stage!=="ganho") b.push(`<span class="chip good" title="Pedido emitido no mês, identificado no Qlik">PEDIDO IDENTIFICADO</span>`);
    if(travado(it)) b.push(`<span class="chip acc" title="Atualizado pela Pipeline de Retenção">na Pipeline</span>`);
  }else if(pk==="inativos"){
    const d = days(TODAY, pd(it.dtUltFat));
    b.push(`<span class="chip ${d>365?"bad":""}">${d} dias sem comprar</span>`);
  }else{
    b.push(`<span class="chip ${it.modo==="ativa"?"acc":""}">${esc(it.origem)}</span>`);
    if(!it.owner) b.push(`<span class="chip warn">sem responsável</span>`);
  }
  if(it.ofensor && (st.end==="lost" || pk!=="prospeccao")) b.push(`<span class="chip bad" title="Ofensor">${esc(it.ofensor)}</span>`);
  if(it.empresa===undefined){ const pc = potChip(it); if(pc) b.push(pc); }
  return b.join("");
}
function proxLabel(it){
  if(!it.prox) return "";
  const d = days(pd(it.prox), TODAY);
  if(d<0) return `<span class="chip bad">contato atrasado ${-d}d</span>`;
  if(d===0) return `<span class="chip warn">contato hoje</span>`;
  return `<span>próx. contato ${fdShort(it.prox)}</span>`;
}

function distList(){
  const f = F("distribuicao");
  return applyFilters("distribuicao", DB.leads.filter(l=> !stageOf("prospeccao",l.stage).end && (f.redistribuir || !l.owner) && gfOk(l)))
    .sort((a,b)=> S.listAsc.dist ? a.dtEntrada.localeCompare(b.dtEntrada) : b.dtEntrada.localeCompare(a.dtEntrada));
}
function bulkList(){ return S.view==="distribuicao" ? distList() : applyFilters(S.view, itemsOf(S.view)); }
function renderBulk(){
  const bar = $("#bulkbar");
  const pk = bulkPk();
  const gest = isGestor();
  const on = (gest && (S.view==="distribuicao" || (S.selectMode && PIPES[S.view]))) || (!gest && S.selectMode && podeSelecionar(S.view));
  if(!on){ bar.hidden = true; return; }
  const P = PIPES[pk];
  const visible = bulkList();
  const n = S.selected.size;
  const semDono = visible.filter(i=>!ownerOf(i) && !stageOf(pk,i.stage).end).length;
  bar.hidden = false;
  bar.innerHTML = `<span><b>${n}</b> ${n===1?"selecionado":"selecionados"}</span>
    <button class="lnk" data-act="selVisible" type="button">Selecionar os ${visible.length} da tela</button>
    ${P.kind==="lead" && semDono? `<button class="lnk" data-act="selSemDono" type="button">Selecionar os ${semDono} sem responsável</button>`:""}
    ${gest?`<select id="bulkOwner" aria-label="Atribuir a">${ownerOptions(P.kind, null, {none:P.kind==="lead", rodizio:P.kind==="lead"})}</select>
    <button class="btn primary" data-act="bulkApply" type="button"${n?"":" disabled"}>Atribuir</button>`:`<span style="flex:1"></span>`}
    ${P.kind==="lead" && podeExcluirLeads()?`<button class="btn danger" data-act="bulkDelete" type="button"${n?"":" disabled"}>Excluir${n?" "+n:""}</button>`:""}
    <button class="lnk" data-act="selClear" type="button">Limpar</button>`;
  if(gest && P.kind==="lead") $("#bulkOwner").value = "__rodizio";
}
function assignItems(ids, target){
  const items = ids.map(findItem).filter(Boolean);
  if(!items.length) return 0;
  if(target==="__rodizio"){
    const load = Object.fromEntries(sdrs().map(p=>[p.id, DB.leads.filter(l=>l.owner===p.id && !stageOf("prospeccao",l.stage).end).length]));
    items.forEach(it=>{
      const id = Object.keys(load).sort((a,b)=>load[a]-load[b])[0];
      setOwner(it, id); load[id]++;
    });
  }else items.forEach(it=> setOwner(it, target||null));
  return items.length;
}
function setOwner(it, id){
  if(it.empresa!==undefined){
    if(it.owner===id) return;
    it.owner = id; it.dtAtrib = id? iso(TODAY): null;
    pushHist(it, id? "Atribuído a "+nameOf(id) : "Responsável removido");
  }else{
    if(it.vend===id || !id) return;
    pushHist(it, "Carteira transferida de "+nameOf(it.vend)+" para "+nameOf(id));
    it.vend = id; it.vendManual = true;
  }
}

/* ---------- Mover etapa ---------- */
function requestMove(id, stageK){
  const it = findItem(id); if(!it) return;
  const pk = pkOfItem(it);
  if(it.stage===stageK) return;
  if(travado(it)){ toast("Este cliente está sendo acompanhado na Pipeline de Retenção neste mês. Atualize por lá; o Hub copia de hora em hora."); return; }
  if(!canEdit(it)){ toast("Você só pode mover os seus próprios clientes e leads."); return; }
  const st = stageOf(pk, stageK);
  if(st.needs || PIPES[pk].kind==="client") openGate(it, pk, st); else { doMove(it, pk, stageK); save(); }
}
function canEdit(it){ return !travado(it) && podeVer(ownerOf(it)); }
function doMove(it, pk, k, extra={}){
  const st = stageOf(pk,k);
  const from = stageOf(pk,it.stage).label;
  it.stage = k; it.dtEtapa = iso(TODAY);
  if(pk==="prospeccao"){ const idx = FUNNEL.indexOf(k); if(idx>it.maxIdx) it.maxIdx = idx; if(k==="proposta") it.dtProposta = iso(TODAY); }
  if(!it.dt1Contato && !["novo","carteira","inativam","inativado","inativo"].includes(k) && !st.end) it.dt1Contato = iso(TODAY);
  if(st.end){ it.prox = null; }
  if(st.end==="won"){ it.valor = extra.valor ?? it.valor; if(pk==="prospeccao") it.dtGanho = iso(TODAY); }
  else if(st.end==="lost"){ if(extra.ofensor){ it.ofensor = extra.ofensor; it.ofDet = extra.ofDet; } }
  else { if(pk!=="ativos") it.valor = 0; }
  if(extra.obs){ pushCrm(it, extra.obs); if(it.empresa===undefined) it.dtUltContato = iso(TODAY); }
  pushHist(it, `${from} → ${st.label}` + (extra.valor? ` · pedido de ${money(extra.valor)}`:"") + (extra.ofensor? ` · ofensor: ${ofSummary(extra.ofensor, extra.ofDet)}`:""));
  if(pk==="prospeccao" && st.end==="won" && extra.vend){
    it.handoffVend = extra.vend;
    const cod = String(900000 + DB.clients.length);
    const segM = SEG_M[it.seg] || 3;
    DB.clients.push({ id:"c"+cod+uid(), cod, cli:it.empresa, cnpj:it.cnpj, uf:it.uf, cid:it.cid, seg:it.seg, vend:extra.vend,
      dtCad: iso(TODAY), dtUltFat: iso(TODAY), dtInat: iso(addMonths(TODAY, segM)), ticket: extra.valor||0, pipe:"ativo", stage:"carteira", valor:0, prox: iso(addDays(TODAY,30)), ofensor:null, ofDet:null, whatsapp:it.whatsapp||it.tel, dt1Contato:it.dt1Contato, dtEtapa:iso(TODAY),
      hist:[{d:iso(TODAY), t:`Novo cliente vindo da prospecção (${nameOf(it.owner)}) · 1º pedido de ${money(extra.valor)}`}],
      crm:(it.crm||[]).slice(), origem:"prospeccao", vendManual:true, linhas:[], acao:null, valorProposta:null, statusErp:"Ativo", tel:it.tel, email:it.email, decisor:it.contato });
    toast(`${it.empresa} entrou na carteira ativa de ${nameOf(extra.vend)}.`);
  }else toast(`${it.cli||it.empresa}: ${st.label}`);
}
function save(){ saveDB(); render(); }

}
function anexoHtml(id){
  if(!id) return "";
  const a = DB.anexos[id];
  if(!a){ carregarAnexo(id).then(x=>{ const el = document.querySelector(`[data-anexo="${id}"]`); if(el) el.outerHTML = x ? anexoHtml(id) : `<div class="anexo">Anexo não encontrado.</div>`; }); return `<div class="anexo" data-anexo="${id}">Carregando anexo…</div>`; }

}

  const kind = (kinds||OF_KIND)[of]; if(!kind) return "";

    <div class="grid2"><label class="fld"><span>Preço oferecido pela concorrência (R$)</span><input id="${px}-preco" type="number" step="0.01" min="0" value="${det.preco||""}"></label>
    <label class="fld"><span>Comprovação (print/áudio do cliente ou orçamento da concorrência) *</span><input id="${px}-file" type="file" accept="image/*,audio/*,.pdf"><span class="note">${det.anexo?"Já existe um anexo. Escolha outro arquivo só se quiser trocar.":"Obrigatório. Fotos são reduzidas automaticamente; áudio e PDF até 150 KB."}</span></label></div>
    ${anexoHtml(det.anexo)}</div>`;
  if(kind==="estoque") return `<div class="of-box">${head}<div class="grid2">
    <label class="fld"><span>Item que fez perder o pedido *</span><input id="${px}-item" value="${esc(det.item||"")}"></label>
    <label class="fld"><span>Quantidade que o cliente compraria</span><input id="${px}-qtd" type="number" min="0" value="${det.qtd||""}"></label></div></div>`;
  if(kind==="giro") return `<div class="of-box">${head}<div class="fld"><span>Quais linhas o cliente compra? *</span>${chk("linhas", LINHAS, det.linhas)}</div>
    <label class="fld"><span>Qual item não está girando?</span><input id="${px}-item" value="${esc(det.item||"")}"></label></div>`;
  if(kind==="meios") return `<div class="of-box">${head}<div class="fld"><span>Quais meios de contato foram tentados? *</span>${chk("meios", MEIOS, det.meios)}</div></div>`;
  if(kind==="credito") return `<div class="of-box">${head}<div class="grid2">
    <label class="fld"><span>Valor do pedido pretendido (R$) *</span><input id="${px}-valorPedido" type="number" min="0" step="10" value="${det.valorPedido||""}"></label>
    <label class="fld"><span>Limite de crédito disponível (R$)</span><input id="${px}-limite" type="number" min="0" step="10" value="${det.limite||""}"></label></div></div>`;
  if(kind==="mix") return `<div class="of-box">${head}<div class="grid2">

    <label class="fld"><span>Quantidade do item *</span><input id="${px}-qtd" type="number" min="1" value="${det.qtd||""}"></label></div>
    <label class="fld"><span>Imagem de exemplo do item *</span><input id="${px}-file" type="file" accept="image/*"><span class="note">${det.anexo?"Já existe uma imagem. Escolha outra só se quiser trocar.":"Obrigatório. Foto ou print do produto que o cliente pediu."}</span></label>

function wireOfensor(selId, det, kinds){
  const sel = document.getElementById(selId); if(!sel) return;
  const box = document.getElementById(selId+"-det");
  const draw = ()=>{ box.innerHTML = ofDetailHtml(sel.value, det, selId, kinds); };
  sel.addEventListener("change", draw); draw();
}
function readFileForAnexo(file, imageOnly){
  return new Promise((resolve)=>{
    if(imageOnly && !file.type.startsWith("image/")) return resolve({err:"Envie uma imagem (foto ou print)."});
    const r = new FileReader();
    r.onerror = ()=> resolve({err:"Não consegui ler o arquivo. Tente outro."});
    r.onload = ()=>{
      if(!file.type.startsWith("image/")){
        if(file.size > 150*1024) return resolve({err:"Áudio ou PDF precisa ter até 150 KB. Envie um arquivo menor ou um print."});
        return resolve({dataUrl:r.result});
      }
      const img = new Image();
      img.onerror = ()=> resolve({err:"Não consegui abrir a imagem. Tente outro arquivo."});
      img.onload = ()=>{
        let max = 900, q = 0.72, out = "";
        for(let i=0;i<4;i++){
          const k = Math.min(1, max/Math.max(img.width, img.height));
          const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          out = c.toDataURL("image/jpeg", q);
          if(out.length < 200*1024*1.37) break; max = Math.round(max*0.75); q -= 0.08;
        }
        resolve({dataUrl:out, type:"image/jpeg"});
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function collectOfensor(selId, prev, required, kinds){
  const sel = document.getElementById(selId); const of = sel ? sel.value : "";
  if(!of) return required ? {ok:false, msg:"Escolha o ofensor."} : {ok:true, of:null, det:null};
  const kind = (kinds||OF_KIND)[of]; const px = selId;
  const val = id => { const el = document.getElementById(px+"-"+id); return el ? el.value.trim() : ""; };
  const checked = name => Array.from(document.querySelectorAll(`.${px}-${name}:checked`)).map(el=>el.value);
  const det = {tipo:of};
  const keepAnexo = prev && prev.tipo===of ? prev.anexo : null;
  async function takeFile(imageOnly, msgMissing){
    const el = document.getElementById(px+"-file"); const f = el && el.files && el.files[0];
    if(f){ const res = await readFileForAnexo(f, imageOnly); if(res.err) return res.err; const id = "a"+uid(); DB.anexos[id] = {dataUrl:res.dataUrl, name:f.name, type:res.type||f.type}; det.anexo = id; return null; }
    if(keepAnexo){ det.anexo = keepAnexo; return null; }
    return msgMissing;
  }
  if(kind==="preco"){ det.item = val("item"); det.preco = Number(val("preco"))||null; const e = await takeFile(false, "Anexe a comprovação (print, áudio ou orçamento da concorrência)."); if(e) return {ok:false,msg:e}; }
  else if(kind==="estoque"){ det.item = val("item"); det.qtd = Number(val("qtd"))||null; if(!det.item) return {ok:false,msg:"Informe o item que fez perder o pedido."}; }
  else if(kind==="giro"){ det.linhas = checked("linhas"); det.item = val("item"); if(!det.linhas.length) return {ok:false,msg:"Marque ao menos uma linha que o cliente compra."}; }
  else if(kind==="meios"){ det.meios = checked("meios"); if(!det.meios.length) return {ok:false,msg:"Marque ao menos um meio de contato tentado."}; }
  else if(kind==="credito"){ det.valorPedido = Number(val("valorPedido"))||null; det.limite = Number(val("limite"))||null; if(!det.valorPedido) return {ok:false,msg:"Informe o valor do pedido pretendido."}; }
  else if(kind==="mix"){ det.item = val("item"); det.qtd = Number(val("qtd"))||null; if(!det.item) return {ok:false,msg:"Informe qual item não temos."}; if(!det.qtd) return {ok:false,msg:"Informe a quantidade do item."}; const e = await takeFile(true, "Anexe uma imagem de exemplo do item."); if(e) return {ok:false,msg:e}; }
  else if(kind==="outro"){ det.descricao = val("desc"); if(!det.descricao) return {ok:false,msg:"Descreva o ofensor."}; }
  return {ok:true, of, det};
}
function ofSummary(of, d){
  if(!of) return ""; d = d||{};
  const parts = [of];
  if(d.item) parts.push(d.item); if(d.qtd) parts.push(d.qtd+" un."); if(d.preco) parts.push("concorrência a "+money(d.preco));
  if(d.linhas && d.linhas.length) parts.push("linhas "+d.linhas.join(", ")); if(d.meios && d.meios.length) parts.push("tentado: "+d.meios.join(", "));
  if(d.valorPedido) parts.push("pedido de "+money(d.valorPedido)+(d.limite?" para limite de "+money(d.limite):"")); if(d.descricao) parts.push(d.descricao);
  return parts.join(" · ");
}

// Campos obrigatórios para mover um cliente que inativa no mês (mesma regra de requiredFieldsForMove da Pipeline).
// "carteira" equivale a Inativam no mês / Inativado.
function reqRisco(from, to){
  const r = new Set(["obs"]);
  if(from==="carteira") ["ult","prox","hora","dec","wpp"].forEach(x=>r.add(x));
  if(to==="contato") ["ult","prox","hora"].forEach(x=>r.add(x));
  else if(to==="proposta" || to==="negociando"){ r.add("prop"); r.add("linhas"); }
  else if(to==="perdido") ["ult","prox","hora","of"].forEach(x=>r.add(x));
  return r;
}
function openGateRisco(it, pk, st){
  const req = reqRisco(it.stage, st.k);
  const R = k => req.has(k) ? " *" : "";
  let body = `<p class="hint">Cliente que inativa no mês: a movimentação segue as regras da Pipeline de Retenção. Campos com * são obrigatórios.</p>
    <label class="fld"><span>CRM - resumo breve do contato *</span><textarea id="g-obs" placeholder="O que aconteceu neste contato?"></textarea></label>`;
  if(req.has("ult") || req.has("prox")) body += `<div class="grid2">
      <label class="fld"><span>Data do último contato${R("ult")}</span><input type="date" id="g-ult" value="${it.dtUltContato||iso(TODAY)}"></label>
      <label class="fld"><span>Próximo contato${R("prox")}</span><input type="date" id="g-prox" value="${it.prox||""}"></label>
      <label class="fld"><span>Horário do próximo contato${R("hora")}</span><input type="time" id="g-hora" value="${it.horaProx||""}"></label></div>`;
  if(req.has("dec") || req.has("wpp")) body += `<div class="grid2">
      <label class="fld"><span>Nome do contato decisor${R("dec")}</span><input id="g-dec" value="${esc(it.decisor||"")}"></label>
      <div class="fld"><span>WhatsApp do decisor${R("wpp")}</span><input id="g-wpp" inputmode="tel" value="${esc(it.whatsapp||"")}"${it.semWpp?" disabled":""}>
        <label class="wpp-off"><input type="checkbox" id="g-semwpp"${it.semWpp?" checked":""}> Cliente sem WhatsApp</label></div></div>`;
  if(req.has("prop")) body += `<div class="grid2">
      <label class="fld"><span>Valor da proposta (R$) *</span><input id="g-prop" type="number" min="0" step="0.01" value="${it.valorProposta||""}"></label>
      <div class="fld"><span>Linhas positivadas *</span><div class="linhas">${LINHAS.map(l=>`<label><input type="checkbox" class="g-linha" value="${l}"${(it.linhas||[]).includes(l)?" checked":""}><span>${l.toUpperCase()}</span></label>`).join("")}</div></div></div>`;
  if(st.k==="ganho"){
    const sug = (it.pedidoId && it.pedidoId.valor) || it.valor || "";
    body += `<label class="fld"><span>Valor do pedido (R$)</span><input id="g-valor" type="number" min="0" step="10" value="${sug}"></label>`;
  }
  if(req.has("of")) body += ofSelectHtml("g-of", it.ofensor, true, OFENSORES_PIPE);
  openModal(`<div class="m-head"><div><h2>${st.label}</h2><p>${esc(it.cli)}</p></div><button class="x" data-act="close" type="button" aria-label="Fechar">×</button></div>
    <form id="gateForm"><div class="m-body">${body}<div class="err" id="g-err" role="alert"></div></div>
    <div class="m-foot"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn primary" type="submit">Confirmar</button></div></form>`, !req.has("of") && !req.has("prop"));
  if(req.has("of")) wireOfensor("g-of", it.ofDet, OF_KIND_PIPE);
  const sw = $("#g-semwpp"); if(sw) sw.addEventListener("change", ()=>{ $("#g-wpp").disabled = sw.checked; });
  $("#gateForm").onsubmit = async e=>{
    e.preventDefault();
    const err = m => { $("#g-err").textContent = m; };
    const v = id => { const el = $("#"+id); return el ? el.value.trim() : ""; };
    const obs = v("g-obs"); if(!obs) return err("Registre o CRM (resumo do contato) antes de mover.");
    if(req.has("ult") && !v("g-ult")) return err("Informe a data do último contato.");
    if(req.has("prox") && !v("g-prox")) return err("Agende o próximo contato.");
    if(req.has("hora") && !v("g-hora")) return err("Informe o horário do próximo contato.");
    if(req.has("dec") && !v("g-dec")) return err("Informe o nome do contato decisor.");
    const semW = $("#g-semwpp") ? $("#g-semwpp").checked : false;
    if(req.has("wpp") && !semW && !v("g-wpp")) return err("Informe o WhatsApp do decisor ou marque que o cliente não tem WhatsApp.");
    let prop = null, linhas = null;
    if(req.has("prop")){ prop = Number(v("g-prop")); if(!(prop>0)) return err("Informe o valor da proposta."); linhas = Array.from(document.querySelectorAll(".g-linha:checked")).map(x=>x.value); if(!linhas.length) return err("Marque ao menos uma linha positivada."); }
    const extra = {obs};
    if(req.has("of")){ const r = await collectOfensor("g-of", it.ofDet, true, OF_KIND_PIPE); if(!r.ok) return err(r.msg); extra.ofensor = r.of; extra.ofDet = r.det; }
    if($("#g-valor")){ const val = Number(v("g-valor")); if(val>0) extra.valor = val; }
    doMove(it, pk, st.k, extra);
    if($("#g-ult")) it.dtUltContato = v("g-ult") || it.dtUltContato;
    if($("#g-prox")){ it.prox = v("g-prox") || it.prox; it.horaProx = v("g-hora") || it.horaProx; }
    if($("#g-dec")){ it.decisor = v("g-dec"); it.semWpp = semW; if(!semW) it.whatsapp = v("g-wpp"); }
    if(prop){ it.valorProposta = prop; it.linhas = linhas; }
    closeModal(); save();
  };
}
function openGate(it, pk, st){
  if(ehRisco(it)) return openGateRisco(it, pk, st);
  const name = it.cli||it.empresa;
  let body = "";
  if(st.needs==="valor" || st.needs==="handoff"){
    const sug = it.valor || it.potencial || it.ticket || "";
    body += `<label class="fld"><span>Valor do pedido (R$)</span><input id="g-valor" type="number" min="0" step="10" value="${sug}"></label>`;
  }
  if(st.needs==="handoff"){
    body += `<label class="fld"><span>Carteira de qual vendedor?</span><select id="g-vend">${sellers().map(p=>opt(p.id,p.nome+" · "+p.time, p.id===it.handoffVend)).join("")}</select></label>
      <p class="hint">O cliente entra na pipeline de Clientes ativos desse vendedor, já com o histórico da prospecção.</p>`;
  }
  if(PIPES[pk].kind==="client" && st.needs!=="ofensor"){
    body += `<label class="fld"><span>CRM - resumo breve do contato *</span><textarea id="g-obs" placeholder="O que aconteceu neste contato?"></textarea></label>
      <div class="grid2"><label class="fld"><span>Agendar próximo contato</span><input type="date" id="g-prox" value="${it.prox||""}"></label>
      <label class="fld"><span>Horário</span><input type="time" id="g-hora" value="${it.horaProx||""}"></label></div>`;
  }
  if(st.needs==="ofensor"){
    body += `<p class="hint">Para mover para ${st.label}, registre o último contato e o ofensor. Os dois são obrigatórios.</p>
      <label class="fld"><span>CRM - resumo breve do contato *</span><textarea id="g-obs" placeholder="Ex.: falei com o comprador, disse que fechou com outro fornecedor pelo preço"></textarea></label>
      ${ofSelectHtml("g-of", it.ofensor, true)}`;
  }
  openModal(`<div class="m-head"><div><h2>${st.label}</h2><p>${esc(name)}</p></div><button class="x" data-act="close" type="button" aria-label="Fechar">×</button></div>
    <form id="gateForm"><div class="m-body">${body}<div class="err" id="g-err" role="alert"></div></div>
    <div class="m-foot"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn primary" type="submit">Confirmar</button></div></form>`, st.needs!=="ofensor");
  if(st.needs==="ofensor") wireOfensor("g-of", it.ofDet);
  $("#gateForm").onsubmit = async e=>{
    e.preventDefault();
    const err = m => { $("#g-err").textContent = m; };
    const extra = {};
    if($("#g-valor")){ const v = Number($("#g-valor").value); if(!(v>0)) return err("Informe o valor do pedido."); extra.valor = v; }
    if($("#g-vend")) extra.vend = $("#g-vend").value;
    if($("#g-obs") && st.needs!=="ofensor"){
      const obs = $("#g-obs").value.trim(); if(!obs) return err("Registre o contato / observação antes de mover.");
      extra.obs = obs;
      const gp = $("#g-prox").value || null; if(gp){ it.prox = gp; it.horaProx = $("#g-hora").value || null; }
    }
    if(st.needs==="ofensor"){
      const obs = $("#g-obs").value.trim(); if(!obs) return err("Registre o contato / observação antes de mover.");
      const r = await collectOfensor("g-of", it.ofDet, true); if(!r.ok) return err(r.msg);
      extra.obs = obs; extra.ofensor = r.of; extra.ofDet = r.det;
    }
    doMove(it, pk, st.k, extra); closeModal(); save();
  };
}

async function saveDetail(id){
  const it = findItem(id); if(!it) return;
  if(travado(it)){ toast("Este cliente está sendo acompanhado na Pipeline de Retenção neste mês."); return; }
  const r = await collectOfensor("d-of", it.ofDet, false, ofKindOf(it));
  if(!r.ok){ $("#d-err").textContent = r.msg; return; }
  const obs = $("#d-obs").value.trim(); if(obs){ pushCrm(it, obs); if(it.empresa===undefined) it.dtUltContato = iso(TODAY); }
  const own = $("#d-owner"); if(own) setOwner(it, own.value || null);
  it.whatsapp = $("#d-wpp").value.trim();
  if($("#c-semwpp")) it.semWpp = $("#c-semwpp").checked;
  if($("#c-prop")){ const v = Number($("#c-prop").value)||null; if(v!==(it.valorProposta||null)){ it.valorProposta = v; if(v) pushHist(it, "Proposta de "+money(v)); } }
  if($("#c-acao")) it.acao = $("#c-acao").value || null;
  if(document.querySelector(".c-linha")) it.linhas = Array.from(document.querySelectorAll(".c-linha:checked")).map(e=>e.value);
  if($("#d-1c")){ const c1 = $("#d-1c").value || null; if(c1!==it.dt1Contato){ it.dt1Contato = c1; if(c1) pushHist(it, "1º contato em "+fd(c1)); } }
  if($("#c-ult") && !obs){ const u = $("#c-ult").value || null; if(u!==it.dtUltContato){ it.dtUltContato = u; if(u) pushHist(it, "Último contato em "+fd(u)); } }
  if($("#c-hora")) it.horaProx = $("#c-hora").value || null;
  if($("#c-dec")) it.decisor = $("#c-dec").value.trim();
  if($("#c-valor")){ const v = Number($("#c-valor").value)||0; if(v!==(it.valor||0)){ it.valor = v; pushHist(it, "Valor de pedido ajustado para "+money(v)); } }
  const prox = $("#d-prox").value || null;
  if(prox!==it.prox){ it.prox = prox; if(prox) pushHist(it, "Próximo contato agendado para "+fd(prox)+(it.horaProx?" às "+it.horaProx:"")); }
  const pot = $("#d-pot"); if(pot) it.potencial = Number(pot.value)||0;
  const seg = $("#d-seg"); if(seg && seg.value!==it.seg){ it.seg = seg.value; pushHist(it, "Segmento alterado para "+it.seg); }
  const org = $("#d-orig"); if(org && org.value!==it.origem){ it.origem = org.value; it.modo = origModo(it.origem); pushHist(it, "Origem alterada para "+it.origem); }
  if(r.of!==it.ofensor || JSON.stringify(r.det)!==JSON.stringify(it.ofDet)){ it.ofensor = r.of; it.ofDet = r.det; pushHist(it, r.of? "Ofensor: "+ofSummary(r.of, r.det) : "Ofensor removido"); }
  closeModal(); save(); toast("Alterações salvas.");
}

const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function carregarXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej)=>{ const sc = document.createElement("script"); sc.src = XLSX_URL; sc.onload = ()=>res(window.XLSX); sc.onerror = ()=>rej(new Error("não carregou o leitor de Excel")); document.head.appendChild(sc); });
}
// Lê a primeira aba e devolve as linhas na ordem do Hub. Se a planilha tiver cabeçalho,
// as colunas são reconhecidas pelo nome (em qualquer ordem).
const IMP_COLS = [["empresa",/^(empresa|raz[aã]o social|nome( fantasia)?|cliente|lead)$/],["cnpj",/^(cnpj|cpf\/?cnpj|documento)$/],["contato",/^(contato|respons[aá]vel|comprador|nome do contato)$/],
  ["tel",/^(telefone|fone|celular|whats ?app|tel)$/],["uf",/^(uf|estado)$/],["cid",/^(cidade|munic[ií]pio)$/],["seg",/^(segmento|seg)$/],["origem",/^(origem|fonte|campanha)$/]];
async function lerPlanilha(file){
  const X = await carregarXlsx();
  const wb = X.read(await file.arrayBuffer(), {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = X.utils.sheet_to_json(ws, {header:1, raw:false, defval:""}).map(r=>r.map(c=>String(c==null?"":c).replace(/[\t\r\n]+/g," ").trim())).filter(r=>r.some(Boolean));
  if(!rows.length) return "";
  const head = rows[0].map(h=>norm(h).toLowerCase());
  const idx = IMP_COLS.map(([,re])=> head.findIndex(h=>re.test(h)));
  const temCab = idx[0]>=0;
  const corpo = temCab ? rows.slice(1) : rows;
  return corpo.map(r=> temCab ? idx.map(i=> i>=0 ? (r[i]||"") : "").join("\t") : r.slice(0,8).join("\t")).join("\n");
}
function parseImport(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const c = l.includes("\t") ? l.split("\t") : l.split(";");
    return {empresa:(c[0]||"").trim(), cnpj:(c[1]||"").trim(), contato:(c[2]||"").trim(), tel:(c[3]||"").trim(), uf:(c[4]||"").trim(), cid:(c[5]||"").trim(), seg:(c[6]||"").trim().toUpperCase(), origem:(c[7]||"").trim()};
  }).filter(r=> r.empresa && norm(r.empresa)!=="empresa");
}

function prospStats(leads){
  const n = leads.length;
  const reach = FUNNEL.map((k,i)=> leads.filter(l=>l.maxIdx>=i).length);
  const won = leads.filter(l=>l.stage==="ganho");
  const val = won.reduce((a,l)=>a+(l.valor||0),0);
  const tempos = won.filter(l=>l.dtGanho && (l.dtAtrib||l.dtEntrada)).map(l=>days(pd(l.dtGanho), pd(l.dtAtrib||l.dtEntrada)));
  const tm = tempos.length? Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length) : null;

  return {n, reach, won:won.length, val, tm, open};

const RISCO_ETAPAS = [

function etapaRisco(c){ return c.stage==="carteira" ? (subEtapaRisco(c)==="Inativado" ? "inativo" : "inativam") : c.stage; }
function riscoBase(mk){
  const B = DB.bases && DB.bases[mk];
  const g = S.gf || {};
  const okVend = v => podeVer(v) && (!(g.vend||[]).length || g.vend.includes(v||"—")) && (!(g.time||[]).length || g.time.includes((person(v)||{}).time||"—"));
  const porCod = new Map(DB.clients.map(c=>[String(c.cod), c]));
  let itens;
  if(B) itens = (B.itens||[]).filter(i=>okVend(i.v)).map(i=>({...i, cli: mk===CUR_MK ? porCod.get(String(i.c)) : null}));
  else if(mk===CUR_MK) itens = DB.clients.filter(c=>c.pipe==="risco" && okVend(c.vend)).map(c=>({c:c.cod, g:c.codGrupo||("c"+c.cod), v:c.vend, cli:c}));
  else itens = [];
  if(mk===CUR_MK) itens = itens.filter(i=>!i.cli || gfOk(i.cli, "status"));
  itens.forEach(i=>{
    if(i.cli){ i.etapa = etapaRisco(i.cli); i.pedido = !!i.cli.pedidoId && i.cli.stage!=="ganho"; i.auto = false; }
    else { i.etapa = i.r || (B && B.fechado ? "perdido" : "inativam"); i.pedido = false; i.auto = !!i.a; }
  });
  const gm = new Map(); itens.forEach(i=>{ if(!gm.has(i.g)) gm.set(i.g, []); gm.get(i.g).push(i); });
  const grupos = [...gm.entries()].map(([k, L])=>{ const rep = L.find(x=>x.etapa==="ganho") || L[0]; return {g:k, itens:L, rep, ganho: rep.etapa==="ganho", v: rep.v}; });
  return {mk, B, provisoria: !B, fechado: !!(B && B.fechado), itens, grupos, criadaEm: B && B.criadaEm};
}
function painelRisco(){
  const mk = S.gf.mes || CUR_MK;
  const RB = riscoBase(mk); const total = RB.grupos.length; const M = DB.metas.impedir || 70;
  const cliDe = L => L.map(x=>x.rep ? x.rep.cli : x.cli).filter(Boolean);

  const series = [["recuperado","Recuperado (inativam no mês)","var(--warn)"],["reativado","Reativado (inativos)","var(--cold)"],["primeiros","1ºs pedidos (prospecção)","var(--accent)"]];
  const grid = [0,0.5,1].map(f=>`<line x1="${RP}" x2="${RW-RP+6}" y1="${RH-RP-(RH-RP*2)*f}" y2="${RH-RP-(RH-RP*2)*f}" stroke="var(--border-soft)"></line><text x="${RP-6}" y="${RH-RP-(RH-RP*2)*f+3}" font-size="10" text-anchor="end" fill="var(--ink-faint)">${f? moneyK(maxR*f).replace("R$ ",""):"0"}</text>`).join("");
  const rbars = rows.map((r,i)=>{ let y = RH-RP; const x = RP + i*rb + rb*0.2, w = rb*0.6;
    const seg = series.map(([k,,c])=>{ const hh = (RH-RP*2)*r[k]/maxR; y -= hh; return `<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${c}"><title>${money(r[k])}</title></rect>`; }).join("");
    const prev = i? tot(rows[i-1]) : null; const cTrend = prev==null? "var(--ink)" : tot(r)>=prev ? "var(--good)" : "var(--bad)";
    const [yy,mm] = r.mk.split("-").map(Number);
    return `${seg}<text x="${x+w/2}" y="${y-6}" font-size="10" font-weight="700" text-anchor="middle" fill="${cTrend}">${moneyK(tot(r)).replace("R$ ","")}</text><text x="${x+w/2}" y="${RH-RP+16}" font-size="10" text-anchor="middle" fill="var(--ink-faint)">${MONTHS[mm-1].slice(0,3)}/${String(yy).slice(2)}${i===rows.length-1?" (parcial)":""}</text>`; }).join("");
  const last = rows.at(-1), prevR = rows.at(-2);
  const delta = prevR ? Math.round((tot(last)-tot(prevR))/Math.max(1,tot(prevR))*100) : 0;
  h += `<section class="panel span-12"><h2>Evolução dos resultados (R$)</h2><p class="sub">Valor dos pedidos de clientes recuperados, reativados e dos primeiros pedidos da prospecção, mês a mês. ${prevR?`<b style="color:${delta>=0?"var(--good)":"var(--bad)"}">${delta>=0?"▲":"▼"} ${Math.abs(delta)}%</b> em relação ao mês anterior (mês atual parcial).`:""}</p>
    <div class="legend">${series.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${RW} ${RH}" width="100%" style="min-width:480px" role="img" aria-label="Evolução mensal dos resultados">${grid}${rbars}</svg></div></section>`;

  // ---- Funil de prospecção (mantido) ----
  const ps = prospStats(leads);
  h += `<section class="panel span-12"><h2>Funil de prospecção</h2><p class="sub">Leads do período por etapa alcançada.</p><div class="funnel">${ps.reach.map((v,i)=>{ const st = stageOf("prospeccao",FUNNEL[i]); return `<div class="f-row"><span class="lb">${st.label}</span><div class="f-track"><div class="f-fill" style="width:${ps.n?Math.max(4,v/ps.n*100):0}%;background:${st.color}">${v}</div></div><span class="pc"><b>${i?pct(v,ps.reach[i-1]):100}%</b>${i?" da anterior":""}</span></div>`; }).join("")}</div></section>`;
  h += `</div>`;
  h += `<p class="hint" style="margin-top:16px">Regras da carteira: ativo = comprou nos últimos 89 dias · inativo = 90 dias ou mais sem compra · inativam no mês = data de inativação (ERP/Qlik) dentro de ${MONTH_LABEL}; essa regra tem prioridade sobre as outras duas. O histórico mensal começa a ser formado a partir da primeira sincronização.</p>`;
  return h;
}

function openAddRow(btn){
  const host = btn.closest(".sel-plus"); const kind = btn.dataset.kind;
  const old = host.parentElement.querySelector(":scope > .addrow"); if(old){ old.querySelector("input").focus(); return; }
  const row = document.createElement("div"); row.className = "addrow"; row.dataset.kind = kind; row.dataset.target = btn.dataset.target;
  row.innerHTML = `<input type="text" placeholder="${kind==="seg"?"Nome do novo segmento":"Nome da nova origem"}" aria-label="${kind==="seg"?"Novo segmento":"Nova origem"}" maxlength="40">`
    + (kind==="orig" ? `<select aria-label="Tipo de captação">${opt("ativa","Captação ativa",true)}${opt("passiva","Captação passiva",false)}</select>` : "")
    + `<button class="btn small primary" type="button" data-act="addOptOk">Adicionar</button><button class="btn small" type="button" data-act="addOptCancel">Cancelar</button><span class="err"></span>`;
  host.insertAdjacentElement("afterend", row);
  const inp = row.querySelector("input"); inp.focus();
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); confirmAddRow(row); } });
}
function confirmAddRow(row){
  const kind = row.dataset.kind; const raw = row.querySelector("input").value.trim();
  const errEl = row.querySelector(".err");
  if(!raw){ errEl.textContent = "Digite um nome."; return; }
  const name = kind==="seg" ? raw.toUpperCase() : raw;
  const exists = kind==="seg" ? segList().some(s=>norm(s)===norm(name)) : origList().some(o=>norm(o.n)===norm(name));
  if(exists){ errEl.textContent = "Já existe com esse nome."; return; }
  if(kind==="seg") DB.segmentos.push(name); else DB.origens.push({n:name, modo:row.querySelector("select").value});
  saveDB();
  const label = kind==="orig" ? `${name} (${origModo(name)})` : name;
  document.querySelectorAll(`select[data-list="${kind}"]`).forEach(sel=>{
    const o = document.createElement("option"); o.value = name; o.textContent = (sel.id==="n-orig"||sel.id==="d-orig"||sel.id==="i-orig") ? label : name; sel.appendChild(o);
  });
  const target = row.dataset.target ? document.getElementById(row.dataset.target) : null;
  row.remove();
  toast(kind==="seg" ? `Segmento ${name} criado.` : `Origem ${name} criada.`);
  if(target){ target.value = name; if(target.dataset.f) target.dispatchEvent(new Event("change", {bubbles:true})); }
  else if($("#overlay").hidden) render();
}

/* ======================= CABEÇALHO DE FILTROS (igual ao da Pipeline de Retenção, vale para todas as pastas) ======================= */
const CUR_MK = iso(TODAY).slice(0,7);
const UFS_BR = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
function gfEmpty(){ return {mes:CUR_MK, dtinat:[], periodo:[], periodoR:{de:"",ate:""}, rapidos:[], etapa:[], acao:[], time:[], vend:[], status:[], seg:[], uf:[], ofensor:[]}; }
function mkLabel(mk){ const [y,m] = mk.split("-").map(Number); return MONTHS[m-1].charAt(0).toUpperCase()+MONTHS[m-1].slice(1)+"/"+y; }
// Mês (base): de outubro/2026 em diante (até dezembro/2027, como a Pipeline de Retenção).
// Ajustes pedidos só para Dashboard e Gestão de contatos (as outras pastas mantêm o cabeçalho anterior).
function novoCab(){ return S.view==="painel" || S.view==="agenda"; }
function mesOptions(){
  const out = [];
  if(novoCab()){ let d = new Date(2026,9,1); while(iso(d).slice(0,7) <= "2027-12"){ out.push(iso(d).slice(0,7)); d = new Date(d.getFullYear(), d.getMonth()+1, 1); } return out; }
  let d = new Date(2026,8,1); while(iso(d).slice(0,7) <= CUR_MK){ out.push(iso(d).slice(0,7)); d = new Date(d.getFullYear(), d.getMonth()+1, 1); } return out.reverse();
}
function diasDoMes(mk){ const [y,m] = mk.split("-").map(Number); const n = new Date(y,m,0).getDate(); return Array.from({length:n},(_,i)=> iso(new Date(y,m-1,i+1))); }
// Data usada pelo Período: inativam no mês = data de inativação; ativos e inativos = data da última movimentação; leads = data de entrada.
function periodoRef(it){ return it.empresa!==undefined ? it.dtEntrada : (it.pipe==="risco" ? it.dtInat : (it.dtEtapa||it.dtInat)); }
// Dashboard e Gestão de contatos não usam o filtro Data de inativação.
function semDtInat(){ return S.view==="painel" || S.view==="agenda"; }
function gfStatusOf(it){ return stageOf(pkOfItem(it), it.stage).label; }
function gfValues(k, it){
  switch(k){
    case "dtinat": return it.empresa!==undefined ? null : it.dtInat;
    case "periodo": return periodoRef(it) || null;
    case "acao": return it.acao || "—";
    case "time": { const p = person(ownerOf(it)); return p ? p.time : "—"; }
    case "vend": return ownerOf(it) || "—";
    case "status": return gfSoProsp() ? gfStatusOf(it) : (it.empresa===undefined ? STATUS_L[pipeKeyOfClient(it)] : null);
    case "etapa": return gfStatusOf(it);
    case "seg": return it.seg || "—";
    case "uf": return it.uf || "—";
    case "ofensor": return it.ofensor || "—";
  }
}
function gfOk(it, skip){
  const g = S.gf;
  if(!gfSoProsp() && g.status.length && g.status.some(v=>!Object.values(STATUS_L).includes(v))) g.status = g.status.filter(v=>Object.values(STATUS_L).includes(v));
  if(g.mes!==CUR_MK && it.empresa===undefined && it.pipe==="risco") return false;
  if(S.view==="carteira" && skip!=="rapidos" && (g.rapidos||[]).length && it.empresa===undefined){ for(const r of g.rapidos){ const q = RAPIDOS.find(x=>x.k===r); if(q && !q.test(it)) return false; } }
  for(const k of ["dtinat","periodo","acao","time","vend","etapa","status","seg","uf","ofensor"]){
    if(k===skip || !g[k].length) continue;
    if(k==="periodo" && !novoCab()) continue;
    if(k==="etapa" && gfSoProsp()) continue;
    if(k==="dtinat" && semDtInat()) continue;
    const v = gfValues(k, it); if(v==null || !g[k].includes(v)) return false;
  }
  if(!novoCab() && skip!=="periodo" && (g.periodoR.de || g.periodoR.ate)){
    const ref = it.empresa!==undefined ? it.dtEntrada : it.dtInat; if(!ref) return false;
    if(g.periodoR.de && ref < g.periodoR.de) return false;
    if(g.periodoR.ate && ref > g.periodoR.ate) return false;
  }
  return true;
}
function gfBase(){
  // tudo o que a pessoa enxerga na pasta atual, antes dos filtros do cabeçalho
  const role = viewerRole();
  const cl = role==="sdr" ? [] : DB.clients.filter(c=> podeVer(c.vend));
  const ld = DB.leads.filter(l=> podeVer(l.owner));
  const v = S.view;
  if(PIPES[v]) return PIPES[v].kind==="lead" ? ld : (PIPES[v].pipe ? cl.filter(c=>c.pipe===PIPES[v].pipe) : cl);
  if(v==="distribuicao") return ld;
  return cl.concat(ld);
}
function gfOptions(k){
  const base = gfBase();
  const cnt = {}; base.filter(i=>gfOk(i,k)).forEach(i=>{ const v = gfValues(k,i); if(v!=null) cnt[v] = (cnt[v]||0)+1; });
  let opts;
  if(k==="dtinat" || k==="periodo"){ opts = diasDoMes(S.gf.mes).map(d=>({v:d, l:fd(d)})); }
  else if(k==="acao") opts = ACOES.concat(["—"]).map(a=>({v:a, l:a==="—"?"Sem ação":a}));
  else if(k==="time") opts = teams().map(t=>({v:t,l:t}));
  else if(k==="vend") opts = DB.people.map(p=>({v:p.id, l:p.nome+(p.papel==="sdr"?" · SDR":"")})).concat([{v:"—", l:"Sem responsável"}]);
  else if(k==="status" && !gfSoProsp()) opts = ["ativos","inativos","risco"].map(pk=>({v:STATUS_L[pk], l:STATUS_L[pk], c:CART[pk].c}));
  else if(k==="etapa" && S.view==="carteira") opts = CART_STAGES.map(st=>({v:st.label, l:st.label, c:st.color}));
  else if(k==="status" || k==="etapa"){ const pks = PIPES[S.view] ? [S.view] : (S.view==="distribuicao" ? ["prospeccao"] : ["ativos","risco","inativos","prospeccao"]); const seen = new Set(); opts = []; pks.forEach(pk=>PIPES[pk].stages.forEach(s=>{ if(!seen.has(s.label)){ seen.add(s.label); opts.push({v:s.label, l:s.label, c:s.color}); } })); }
  else if(k==="seg") opts = segList().map(s=>({v:s,l:s}));
  else if(k==="uf") opts = UFS_BR.map(u=>({v:u,l:u}));
  else if(k==="ofensor") opts = OFENSORES.concat(["—"]).map(o=>({v:o, l:o==="—"?"Sem ofensor":o}));
  opts.forEach(o=> o.n = cnt[o.v]||0);
  if(["seg","uf"].includes(k)) opts.sort((a,b)=> (b.n>0)-(a.n>0) || 0);
  return opts;
}
function gfFieldsFor(){
  let f = GF_FIELDS.filter(([k])=> !(k==="dtinat" && semDtInat()));
  if(!gfSoProsp()){ const i = f.findIndex(([k])=>k==="status"); f = f.slice(0,i).concat([["etapa","Etapa do funil"]]).concat(f.slice(i)); }
  return f;
}
// Filtros rápidos da Carteira de clientes (pela data do último faturamento vindo do ERP/Qlik).
const PREV_MONTH_START = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
// Com a pasta Pedidos do Qlik configurada, o robô grava pedMes/pedMesAnt (valor em R$); sem ela, vale a data do último faturamento.
const semPedMes = c => c.pedMes!=null ? !(c.pedMes > 0) && c.stage!=="ganho" : (pd(c.dtUltFat) < MONTH_START && c.stage!=="ganho");
const semPedAnt = c => c.pedMesAnt!=null ? !(c.pedMesAnt > 0) : pd(c.dtUltFat) < PREV_MONTH_START;
const sem60 = c => days(TODAY, pd(c.dtUltFat)) >= 60;
const adimp = c => !(c.inad > 0);
const RAPIDOS = [
  {k:"semPedMes", l:"Clientes sem pedidos no mês atual", test:semPedMes},
  {k:"adSemPedMes", l:"Clientes adimplentes sem pedido no mês atual", test:c=> adimp(c) && semPedMes(c)},
  {k:"adSemPedAnt", l:"Clientes adimplentes sem pedido no mês anterior", test:c=> adimp(c) && semPedAnt(c)},
  {k:"semPedAnt", l:"Clientes sem pedido no mês anterior", test:semPedAnt},
  {k:"adSem60", l:"Clientes adimplentes sem pedido há 60 dias", test:c=> adimp(c) && sem60(c)},
  {k:"sem60", l:"Clientes sem pedidos há 60 dias", test:sem60},
  {k:"inad", l:"Clientes inadimplentes no momento", test:c=> (c.inad||0) > 0}
];
const GF_FIELDS = [["mes","Mês (base)"],["dtinat","Data de inativação"],["periodo","Período"],["acao","Ação"],["time","Time"],["vend","Vendedor"],["status","Status"],["seg","Segmento"],["uf","UF"],["ofensor","Ofensor"],["marc","Marcadores"]];
// Status = carteira do cliente (ativos, inativos, inativam no mês). Etapa do funil = etapa do cartão.
// Na Prospecção e na Distribuição só existem leads: lá o Status continua sendo a etapa do lead.
const STATUS_L = {ativos:"Clientes ativos", inativos:"Clientes inativos", risco:"Clientes que inativam no mês"};
function gfSoProsp(){ return S.view==="prospeccao" || S.view==="distribuicao"; }
function gfActiveCount(){ const g = S.gf; return (S.view==="carteira" ? (g.rapidos||[]).length : 0) + (!gfSoProsp() && (g.etapa||[]).length ? 1 : 0) + ["dtinat","periodo","acao","time","vend","status","seg","uf","ofensor"].reduce((a,k)=>a+(g[k].length && !(k==="dtinat" && semDtInat()) && !(k==="periodo" && !novoCab())?1:0),0) + (!novoCab() && (g.periodoR.de||g.periodoR.ate) ? 1 : 0); }
function presetsKey(){ return S.viewer; }
function myPresets(){ DB.presets = DB.presets || {}; return DB.presets[presetsKey()] || (DB.presets[presetsKey()] = []); }
function renderGfBar(){
  const g = S.gf; const el = $("#gfbar");
  if(S.view==="gerencial"){ el.innerHTML = ""; return; } // a Visão gerencial tem filtros próprios
  const chev = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
  if(!mesOptions().includes(g.mes)){ g.mes = CUR_MK; g.dtinat = []; g.periodo = []; }
  const btnTxt = k => {
    if(k==="periodo" && !novoCab()){ const p = g.periodoR; return (p.de||p.ate) ? `${p.de?fdShort(p.de):"início"} a ${p.ate?fdShort(p.ate):"hoje"}` : "Todos"; }
    if(k==="marc"){ const n = myPresets().length; return n ? `★ ${n} salvo(s)` : "Nenhum salvo"; }
    const a = g[k]; if(!a.length) return "Todos";
    if(a.length===1){ const o = gfOptions(k).find(o=>o.v===a[0]); return o ? o.l : a[0]; }
    return a.length+" selecionados";
  };
  const has = k => (k==="periodo" && !novoCab()) ? !!(g.periodoR.de||g.periodoR.ate) : k==="marc" ? myPresets().length>0 : (g[k]||[]).length>0;
  const n = gfActiveCount();
  el.innerHTML = `<div class="gf-panel${S.gfOpen?" open":""}"><button type="button" class="gf-toggle" data-act="gfToggle">Filtros${n?` <b>${n}</b>`:""} ${chev}</button><div class="gf-grid">${gfFieldsFor().map(([k,t])=>{
    if(k==="mes") return `<label class="gf-field"><span>${t}</span><select id="gf-mes" class="gf-select">${mesOptions().map(mk=>opt(mk, mkLabel(mk)+(mk<CUR_MK?" · fechado":mk>CUR_MK?" · futuro":""), mk===g.mes)).join("")}</select></label>`;
    return `<div class="gf-field"><span>${t}${has(k)&&k!=="marc"?` <button type="button" class="gf-clear" data-act="gfClear" data-k="${k}">✕ limpar</button>`:""}</span><button type="button" class="gf-btn${has(k)?" on":""}${k==="marc"&&has(k)?" star":""}" data-act="gfOpen" data-k="${k}" aria-haspopup="true">${esc(btnTxt(k))}${chev}</button></div>`;
  }).join("")}</div>${S.view==="carteira"?`<div class="gf-rapidos"><span>Filtros rápidos</span>${RAPIDOS.map(r=>{ const on = (g.rapidos||[]).includes(r.k); const cnt = gfBase().filter(c=>gfOk(c,"rapidos") && r.test(c)).length; return `<button type="button" class="gf-chip${on?" on":""}" data-act="gfRapido" data-k="${r.k}" aria-pressed="${on}">${r.l}<b class="num">${cnt}</b></button>`; }).join("")}</div>`:""}${n?`<button type="button" class="gf-clearall" data-act="gfClearAll">Limpar todos os filtros</button>`:""}${g.mes!==CUR_MK?`<p class="gf-note">${g.mes>CUR_MK?`${mkLabel(g.mes)} ainda não começou: a base de clientes que inativam nesse mês entra no dia 01, pela sincronização do Qlik.`:`${mkLabel(g.mes)} é um mês fechado; na versão final ele fica disponível somente para leitura.`} Neste protótipo só há dados de ${mkLabel(CUR_MK)}.</p>`:""}</div>`;
  $("#gf-mes").onchange = e=>{ S.gf.mes = e.target.value; S.gf.dtinat = []; if(novoCab()) S.gf.periodo = []; closeGfPop(); render(); };
}
function closeGfPop(){ const p = $("#gfpop"); if(p){ p.remove(); } document.removeEventListener("keydown", gfEsc); }
function gfEsc(e){ if(e.key==="Escape") closeGfPop(); }
function openGfPop(btn){
  const k = btn.dataset.k; closeGfPop();
  const pop = document.createElement("div"); pop.id = "gfpop"; pop.className = "gf-pop"; pop.dataset.k = k;
  document.body.appendChild(pop); fillGfPop(pop, k);
  const r = btn.getBoundingClientRect();
  const w = Math.min(300, window.innerWidth-24);
  pop.style.width = w+"px";
  pop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + "px";
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  const s = pop.querySelector("input[type=search],input[type=date],input[type=text]"); if(s) s.focus();
  document.addEventListener("keydown", gfEsc);
}
function fillGfPop(pop, k){
  const g = S.gf;
  if(k==="periodo" && !novoCab()){
    const p = g.periodoR;
    const pres = [["Esta semana", iso(addDays(TODAY, -((TODAY.getDay()+6)%7))), iso(addDays(TODAY, 6-((TODAY.getDay()+6)%7)))],["Até sexta", iso(TODAY), iso(addDays(TODAY,(5-TODAY.getDay()+7)%7))],["Este mês", iso(MONTH_START), iso(MONTH_END)],["Últimos 30 dias", iso(addDays(TODAY,-30)), iso(TODAY)],["Últimos 90 dias", iso(addDays(TODAY,-90)), iso(TODAY)]];
    pop.innerHTML = `<p class="hint" style="margin:0 0 8px">Clientes pela data de inativação; leads pela data de entrada.</p>
      <div class="gf-presets">${pres.map(([l,a,b])=>`<button type="button" class="chip-btn" data-act="gfPeriodoR" data-de="${a}" data-ate="${b}">${l}</button>`).join("")}</div>
      <div class="grid2" style="margin-top:8px"><label class="fld"><span>De</span><input type="date" id="gfp-de" value="${p.de}"></label><label class="fld"><span>Até</span><input type="date" id="gfp-ate" value="${p.ate}"></label></div>
      <div class="gf-pop-foot"><button type="button" class="btn small" data-act="gfPeriodoR" data-de="" data-ate="">Limpar</button><button type="button" class="btn small primary" data-act="gfPeriodoRApply">Aplicar</button></div>`;
    return;
  }
  if(k==="marc"){
    const list = myPresets();
    pop.innerHTML = `<div class="gf-list">${list.map(m=>`<div class="gf-preset"><button type="button" class="gf-preset-apply" data-act="gfPresetApply" data-id="${m.id}">★ ${esc(m.name)}</button><button type="button" class="gf-x" data-act="gfPresetDel" data-id="${m.id}" aria-label="Excluir marcador ${esc(m.name)}">✕</button></div>`).join("") || `<p class="hint" style="margin:4px 0">Nenhum marcador salvo.</p>`}</div>
      <div class="gf-save"><input type="text" id="gfm-name" placeholder="Nome do marcador" maxlength="40"><button type="button" class="btn small primary" data-act="gfPresetSave"${gfActiveCount()?"":" disabled"}>Salvar filtros atuais</button></div>
      <p class="hint" style="margin:6px 0 0">${gfActiveCount()?"Guarda a combinação de filtros escolhida no cabeçalho.":"Escolha algum filtro antes de salvar um marcador."} Cada pessoa vê só os seus marcadores.</p>`;
    return;
  }
  const opts = gfOptions(k); const sel = new Set(g[k]);
  const q = pop.querySelector("#gf-q") ? pop.querySelector("#gf-q").value : "";
  const quick = k==="periodo" ? (()=>{ const ws = addDays(TODAY, -((TODAY.getDay()+6)%7)); const semana = Array.from({length:7},(_,i)=>iso(addDays(ws,i))); const ateSexta = Array.from({length:((5-TODAY.getDay()+7)%7)+1},(_,i)=>iso(addDays(TODAY,i)));
      const inMes = arr => arr.filter(d=>d.slice(0,7)===S.gf.mes).join(",");
      return `<p class="hint" style="margin:0">Inativam no mês pela data de inativação; ativos e inativos pela última movimentação; leads pela data de entrada.</p><div class="gf-presets">${[["Mês inteiro", diasDoMes(S.gf.mes).join(",")],["Hoje", inMes([iso(TODAY)])],["Esta semana", inMes(semana)],["Até sexta", inMes(ateSexta)]].filter(x=>x[1]).map(([l,v])=>`<button type="button" class="chip-btn" data-act="gfQuick" data-days="${v}">${l}</button>`).join("")}</div>`; })() : "";
  pop.innerHTML = quick + (opts.length>6 ? `<input type="search" id="gf-q" placeholder="Buscar…" value="${esc(q)}" aria-label="Buscar opção">` : "")
    + `<div class="gf-list">${opts.map(o=>`<label class="gf-opt" data-s="${esc(norm(o.l))}"><input type="checkbox" data-gfv="${esc(o.v)}"${sel.has(o.v)?" checked":""}>${o.c?`<i style="background:${o.c}"></i>`:""}<span>${esc(o.l)}</span><small>${o.n}</small></label>`).join("")}</div>
    <div class="gf-pop-foot"><button type="button" class="btn small" data-act="gfClear" data-k="${k}">Limpar</button><button type="button" class="btn small primary" data-act="gfPopClose">Pronto</button></div>`;
  const qi = pop.querySelector("#gf-q");
  if(qi){ const run = ()=>{ const v = norm(qi.value); pop.querySelectorAll(".gf-opt").forEach(o=> o.hidden = v && !o.dataset.s.includes(v)); }; qi.addEventListener("input", run); run(); }
}
function gfApply(){ render(); const pop = $("#gfpop"); if(pop && pop.dataset.k!=="periodo" && pop.dataset.k!=="marc"){ const st = pop.querySelector(".gf-list").scrollTop; fillGfPop(pop, pop.dataset.k); pop.querySelector(".gf-list").scrollTop = st; } }

// Cada pasta tem o seu próprio cabeçalho de filtros: o que se escolhe numa pasta não muda as outras.
S.gfv = {};
const gfKey = () => isCarteira(S.view) ? "carteira" : S.view; // as três abas da carteira dividem o mesmo cabeçalho
Object.defineProperty(S, "gf", { get(){ const k = gfKey(); return S.gfv[k] || (S.gfv[k] = gfEmpty()); }, set(v){ S.gfv[gfKey()] = v; } });

/* ======================= EVENTOS ======================= */
document.addEventListener("click", e=>{
  const t = e.target;
  const gp = $("#gfpop");
  if(gp && !gp.contains(t) && !t.closest('[data-act="gfOpen"]')) closeGfPop();
  const tab = t.closest("[data-view]");
  if(tab){ S.view = ["ativos","risco","inativos"].includes(tab.dataset.view) ? "carteira" : tab.dataset.view; lsSet("hub_view", S.view); S.selected.clear(); S.selectMode=false; toggleSide(false); render(); window.scrollTo(0,0); return; }
  const a = t.closest("[data-act]");
  if(a){
    const act = a.dataset.act;
    if(act==="close"){ closeModal(); return; }
    if(act==="closeNotice"){ S.noticeClosed = true; lsSet("hub_notice_base2","1"); render(); return; }
    if(act==="layout"){ S.layout[S.view] = a.dataset.v; render(); return; }
    if(act==="selectMode"){ S.selectMode = !S.selectMode; S.selected.clear(); if(S.selectMode && S.view!=="prospeccao") S.layout[S.view]="list"; render(); return; }
    if(act==="selVisible"){ bulkList().forEach(i=>S.selected.add(i.id)); render(); return; }
    if(act==="selSemDono"){ bulkList().filter(i=>!ownerOf(i) && !stageOf(bulkPk(),i.stage).end).forEach(i=>S.selected.add(i.id)); render(); return; }
    if(act==="selClear"){ S.selected.clear(); render(); return; }
    if(act==="bulkApply"){
      const target = $("#bulkOwner").value; const n = assignItems(Array.from(S.selected), target);
      S.selected.clear(); save();
      toast(target==="__rodizio" ? `${n} leads distribuídos entre os prospectores.` : `${n} ${n===1?"registro atribuído":"registros atribuídos"} a ${nameOf(target)}.`);
      return;
    }
    if(act==="clearFilters"){ S.filters[S.view] = null; render(); return; }
    if(act==="newLead"){ openNewLead(); return; }
    if(act==="import"){ openImport(); return; }
    if(act==="gerReset"){ S.ger = null; render(); return; }
    if(act==="delLead"){ confirmarExclusao([a.dataset.id]); return; }
    if(act==="bulkDelete"){ confirmarExclusao(Array.from(S.selected)); return; }
    if(act==="confirmDel"){ excluirLeads(S.delIds||[]); return; }
    if(act==="fillSample"){ $("#i-txt").value = SAMPLE_IMPORT; $("#i-txt").dispatchEvent(new Event("input")); return; }
    if(act==="saveDetail"){ saveDetail(a.dataset.id); return; }
    if(act==="gfToggle"){ S.gfOpen = !S.gfOpen; renderGfBar(); return; }
    if(act==="gfOpen"){ const open = $("#gfpop"); if(open && open.dataset.k===a.dataset.k){ closeGfPop(); return; } openGfPop(a); return; }
    if(act==="gfPopClose"){ closeGfPop(); return; }
    if(act==="gfClear"){ if(a.dataset.k==="periodo" && !novoCab()){ S.gf.periodoR = {de:"",ate:""}; closeGfPop(); render(); return; } S.gf[a.dataset.k] = []; gfApply(); return; }
    if(act==="gfPeriodoR"){ S.gf.periodoR = {de:a.dataset.de, ate:a.dataset.ate}; closeGfPop(); render(); return; }
    if(act==="gfPeriodoRApply"){ const de = $("#gfp-de").value, ate = $("#gfp-ate").value; S.gf.periodoR = {de: de&&ate&&de>ate?ate:de, ate: de&&ate&&de>ate?de:ate}; closeGfPop(); render(); return; }
    if(act==="gfRapido"){ const g = S.gf; g.rapidos = g.rapidos||[]; const i = g.rapidos.indexOf(a.dataset.k); i>=0 ? g.rapidos.splice(i,1) : g.rapidos.push(a.dataset.k); render(); return; }
    if(act==="gfQuick"){ S.gf.periodo = a.dataset.days.split(",").filter(Boolean); gfApply(); return; }
    if(act==="gfClearAll"){ const mes = S.gf.mes; S.gf = gfEmpty(); S.gf.mes = mes; closeGfPop(); render(); return; }
    if(act==="gfPresetSave"){ const nm = ($("#gfm-name").value||"").trim() || "Marcador "+(myPresets().length+1); myPresets().push({id:uid(), name:nm, gf:JSON.parse(JSON.stringify(S.gf))}); saveDB(); closeGfPop(); render(); toast(`Marcador "${nm}" salvo.`); return; }
    if(act==="gfPresetApply"){ const m = myPresets().find(x=>x.id===a.dataset.id); if(m){ S.gf = Object.assign(gfEmpty(), JSON.parse(JSON.stringify(m.gf))); if(!Array.isArray(S.gf.periodo)) S.gf.periodo = []; if(!S.gf.rapidos) S.gf.rapidos = []; if(!S.gf.etapa) S.gf.etapa = []; if(!S.gf.periodoR) S.gf.periodoR = {de:"",ate:""}; closeGfPop(); render(); toast(`Filtros do marcador "${m.name}" aplicados.`); } return; }
    if(act==="gfPresetDel"){ const L = myPresets(); const i = L.findIndex(x=>x.id===a.dataset.id); if(i>=0){ const nm = L[i].name; L.splice(i,1); saveDB(); renderGfBar(); fillGfPop($("#gfpop"),"marc"); toast(`Marcador "${nm}" excluído.`); } return; }
    if(act==="editMetas"){ openMetas(); return; }
    if(act==="rankCrm"){ openCrmRank(); return; }
    if(act==="agCart"){ S.view = "agenda"; S.agCart = a.dataset.v; render(); return; }
    if(act==="trocarUsuario" || act==="sair"){ sair(); return; }
    if(act==="addPessoa"){ addPessoa(); return; }
    if(act==="salvarPessoas"){ salvarPessoas(); return; }
    if(act==="agWeek"){ S.agWeek = !S.agWeek; render(); return; }
    if(act==="agDay"){ S.agSel = a.dataset.d; const d = pd(a.dataset.d); S.agMonth = [d.getFullYear(), d.getMonth()]; render(); return; }
    if(act==="agNav"){ const v = Number(a.dataset.v); if(!v){ S.agMonth = [TODAY.getFullYear(), TODAY.getMonth()]; S.agSel = iso(TODAY); } else { const d = new Date(S.agMonth[0], S.agMonth[1]+v, 1); S.agMonth = [d.getFullYear(), d.getMonth()]; } render(); return; }
    if(act==="contact"){ openContact(a.dataset.id); return; }
    if(act==="fullCard"){ const id = a.dataset.id; closeModal(); openDetail(id); return; }
    if(act==="saveContact"){ saveContact(a.dataset.id); return; }
    if(act==="colSort"){ const k = a.dataset.k; S.colSort[k] = S.colSort[k]==="asc" ? "desc" : "asc"; render(); return; }
    if(act==="listSort"){ S.listAsc[S.view] = !S.listAsc[S.view]; render(); return; }
    if(act==="listSortDist"){ S.listAsc.dist = !S.listAsc.dist; render(); return; }
    if(act==="segFilter"){ const v = a.dataset.seg; S.gf.seg = S.gf.seg.length===1 && S.gf.seg[0]===v ? [] : [v]; render(); return; }
    if(act==="tempGo"){ S.view = "prospeccao"; S.layout.prospeccao = "board"; F("prospeccao").temp = a.dataset.t; render(); window.scrollTo(0,0); return; }
    if(act==="addOpt"){ openAddRow(a); return; }
    if(act==="addOptCancel"){ a.closest(".addrow").remove(); return; }
    if(act==="addOptOk"){ confirmAddRow(a.closest(".addrow")); return; }
    if(act==="period"){ S.period = a.dataset.v; render(); return; }

  }
  const dr = t.closest("[data-drill]");
  if(dr && !t.closest("[data-open]")){ openDrill(dr.dataset.drill); return; }
  const mv = t.closest("[data-move]");
  if(mv){ if(mv.disabled) return; const id = $("[data-act=saveDetail]")?.dataset.id; if(id){ const it = findItem(id); closeModal(); requestMove(it.id, mv.dataset.move); } return; }
  if(t.matches("[data-sel]")){ const id=t.dataset.sel; t.checked? S.selected.add(id): S.selected.delete(id); render(); return; }
  const mtg = t.closest("[data-metas-toggle] > summary"); if(mtg){ setTimeout(()=>{ S.metasAbertas = mtg.parentElement.open; }, 0); }
  if(t.matches("[data-selcol]")){ const k = t.dataset.selcol; bulkList().filter(i=>i.stage===k).forEach(i=> t.checked? S.selected.add(i.id): S.selected.delete(i.id)); render(); return; }
  if(t.matches("[data-selall]")){ const list = bulkList(); list.forEach(i=> t.checked? S.selected.add(i.id): S.selected.delete(i.id)); render(); return; }
  const og = t.closest("[data-owner-go]");
  if(og){ S.view = "prospeccao"; S.gf.vend = [og.dataset.ownerGo]; render(); window.scrollTo(0,0); return; }
  const vg = t.closest("[data-vend-go]");
  if(vg){ S.view = "carteira"; S.gf.vend = [vg.dataset.vendGo]; render(); window.scrollTo(0,0); return; }
  const card = t.closest(".card");
  if(card){ if(S.selectMode){ const id=card.dataset.id; S.selected.has(id)? S.selected.delete(id): S.selected.add(id); render(); } else openDetail(card.dataset.id); return; }
  const row = t.closest("tr[data-open]");
  if(row){ if(S.selectMode){ const id=row.dataset.open; S.selected.has(id)? S.selected.delete(id): S.selected.add(id); render(); } else openDetail(row.dataset.open); return; }
  if(t.id==="overlay") closeModal();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#overlay").hidden) closeModal();
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("card")) openDetail(e.target.dataset.id);

const onFilter = e=>{
  const el = e.target; if(!el.dataset || !el.dataset.f) return;
  const f = F(S.view); f[el.dataset.f] = el.type==="checkbox" ? el.checked : el.value;
  if(el.type==="search"){ const pos = el.selectionStart; render(); const n = document.getElementById(el.id); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  else render();
};
document.addEventListener("input", e=>{ if(e.target.type==="search") onFilter(e); });
document.addEventListener("change", e=>{
  if(e.target.matches && e.target.matches("[data-gfv]")){ const k = $("#gfpop").dataset.k; const v = e.target.dataset.gfv; const set = new Set(S.gf[k]); e.target.checked ? set.add(v) : set.delete(v); S.gf[k] = Array.from(set); gfApply(); return; } if(e.target.dataset && e.target.dataset.f && e.target.type!=="search") onFilter(e); });

// Tema
(function(){
  const saved = lsGet("hub_theme",""); if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#themeBtn").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx = cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme", nx); lsSet("hub_theme", nx);
  });
})();

/* ======================= ACESSO E INICIALIZAÇÃO ======================= */
// Identificação por e-mail, como na Pipeline de Retenção: o e-mail precisa estar cadastrado em Pessoas e acessos.
const IDENT_KEY = "hub_identidade";
function identidade(){ try{ return JSON.parse(localStorage.getItem(IDENT_KEY)||"null"); }catch(e){ return null; } }
function resolverAcesso(email){
  const e = String(email||"").trim().toLowerCase(); if(!e) return null;
  const p = DB.people.find(p=>(p.email||"").toLowerCase()===e);
  if(p) return p.acesso==="total" ? "gestor" : p.id;
  if((DB.gestores||[]).map(x=>x.toLowerCase()).includes(e)) return "gestor";
  return null;
}
function telaLogin(msg){
  const o = $("#overlay"); o.hidden = false;
  o.innerHTML = `<div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="lg-t"><div class="m-head"><div><h2 id="lg-t">Entrar no Hub Comercial</h2><p>Informe seu nome e o e-mail cadastrado pela gestão.</p></div></div>
    <form id="lgForm"><div class="m-body"><label class="fld"><span>Nome e sobrenome</span><input id="lg-nome" autocomplete="name" required></label>
    <label class="fld"><span>E-mail</span><input id="lg-email" type="email" autocomplete="email" placeholder="seuemail@dellamed.com.br" required></label>
    <div class="err" role="alert">${esc(msg||"")}</div><p class="hint">Se ainda não tem acesso, peça para a gestão cadastrar seu e-mail em Equipe e conversão › Pessoas e acessos.</p></div>
    <div class="m-foot"><button class="btn primary" type="submit">Entrar</button></div></form></div>`;
  $("#lg-nome").focus();
  $("#lgForm").onsubmit = e=>{ e.preventDefault(); const nome = $("#lg-nome").value.trim(), email = $("#lg-email").value.trim();
    const acc = resolverAcesso(email); if(!acc){ telaLogin("Esse e-mail ainda não tem acesso ao Hub."); return; }
    try{ localStorage.setItem(IDENT_KEY, JSON.stringify({nome, email})); }catch(_){}
    o.hidden = true; o.innerHTML = ""; entrar({nome, email}, acc); };
}
async function entrar(id, acc){
  S.identNome = id.nome; S.identEmail = id.email; S.identAcc = acc; S.viewer = acc;
  $("#main").innerHTML = `<div class="panel" style="text-align:center;padding:40px;color:var(--ink-faint)">Carregando a carteira…</div>`;
  try{ await carregarClientes(); }catch(e){ console.error(e); toast("Não consegui carregar a carteira de clientes."); }
  ouvir(); render();
}
// Sair recarrega a página, para a próxima pessoa carregar só a carteira dela.
function sair(){ try{ localStorage.removeItem(IDENT_KEY); }catch(_){} location.reload(); }
async function boot(){
  $("#main").innerHTML = `<div class="panel" style="text-align:center;padding:40px;color:var(--ink-faint)">Carregando o Hub…</div>`;
  try{
    FIREBASE_CONFIG = await (await fetch("config/firebase-web.json", {cache:"no-store"})).json();
    if(!FIREBASE_CONFIG.projectId || /COLE/.test(FIREBASE_CONFIG.apiKey||"")) throw new Error("Preencha o arquivo config/firebase-web.json com a configuração do app web do Firebase (passo 2 do guia).");
    const app = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.firestore(app);
    await loadAll();
    try{ const r = await fetch("config/organograma.json", {cache:"no-store"}); ORGANOGRAMA = (await r.json()).pessoas || []; }catch(e){ console.error("organograma", e); }
    if(ORGANOGRAMA.length && aplicarOrganograma()) saveDB();
  }catch(e){
    console.error(e);
    $("#main").innerHTML = `<div class="notice"><div><b>Não consegui abrir o banco de dados.</b> Confira a internet e se as regras do Firestore liberam as coleções hub_ (veja o README). Detalhe: ${esc(e && e.message || e)}</div></div>`;
    return;
  }
  const id = identidade(); const acc = id && resolverAcesso(id.email);
  if(!acc) telaLogin(); else entrar(id, acc);
}
boot();
</script>
