<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Comercial Dellamed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: barra azul-marinho da Dellamed + abas por carteira; cada aba é um quadro (kanban) ou lista, e o Painel resume funil e conversão. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --surface-2:#eaeef8; --surface-3:#dde3f2;
  --ink:#101a33; --ink-dim:#57628a; --ink-faint:#8792b3;
  --border:#dbe1f0; --border-soft:#e8ecf7;
  --navy:#0b2f6b; --navy-2:#123a86; --navy-3:#0e2a5c;
  --accent:#2e5bff; --accent-soft:#e7ecff; --on-accent:#ffffff;
  --good:#137a4e; --good-soft:#e2f5ec; --warn:#b5730a; --warn-soft:#fdf0dc;
  --bad:#c02e3a; --bad-soft:#fbe6e8; --cold:#5c6a8f; --cold-soft:#eaedf6;
  --st1:#3b7fd9; --st2:#7a5cd6; --st3:#c98a1f; --st4:#0f8a8a;
  --shadow:0 1px 2px rgba(16,26,51,.06), 0 8px 24px -12px rgba(16,26,51,.18);
  --shadow-lg:0 4px 10px rgba(16,26,51,.08), 0 24px 48px -20px rgba(16,26,51,.3);
  --radius:14px; --radius-sm:9px;
  --f-display:'Sora','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --surface:#131c30; --surface-2:#182338; --surface-3:#1f2c47;
    --ink:#eef1fb; --ink-dim:#a3adcc; --ink-faint:#6d7797;
    --border:#2a3554; --border-soft:#212c47;
    --navy:#16336f; --navy-2:#1c4291; --navy-3:#122a5c;
    --accent:#6d8cff; --accent-soft:#1c2b57; --on-accent:#0b1120;
    --good:#3fcf94; --good-soft:#123528; --warn:#f2ab3f; --warn-soft:#3a2c11;
    --bad:#ff6b76; --bad-soft:#3c1b21; --cold:#93a0c7; --cold-soft:#1c2440;
    --st1:#6aa5ff; --st2:#a68cff; --st3:#e8b04f; --st4:#3cc8c8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131c30; --surface-2:#182338; --surface-3:#1f2c47;
  --ink:#eef1fb; --ink-dim:#a3adcc; --ink-faint:#6d7797;
  --border:#2a3554; --border-soft:#212c47;
  --navy:#16336f; --navy-2:#1c4291; --navy-3:#122a5c;
  --accent:#6d8cff; --accent-soft:#1c2b57; --on-accent:#0b1120;
  --good:#3fcf94; --good-soft:#123528; --warn:#f2ab3f; --warn-soft:#3a2c11;
  --bad:#ff6b76; --bad-soft:#3c1b21; --cold:#93a0c7; --cold-soft:#1c2440;
  --st1:#6aa5ff; --st2:#a68cff; --st3:#e8b04f; --st4:#3cc8c8;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:13.5px; line-height:1.45; margin:0;}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
.num{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- Shell: menu lateral (estrutura do painel Abradilan) ---------- */
.shell{display:flex; min-height:100vh;}
.side{position:sticky; top:0; height:100vh; flex:0 0 236px; background:linear-gradient(170deg,var(--navy) 0%,var(--navy-3) 100%); color:#fff; display:flex; flex-direction:column; z-index:40;}
.side-brand{display:flex; align-items:center; gap:10px; padding:18px 16px 16px; border-bottom:1px solid rgba(255,255,255,.1);}
.brand-mark{width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; flex:none;}
.side-brand b{font-family:var(--f-display); font-size:15px; display:block; line-height:1.1;}
.side-brand small{font-size:10px; letter-spacing:.09em; text-transform:uppercase; opacity:.7;}
.nav{flex:1; overflow-y:auto; padding:10px 10px 16px; display:flex; flex-direction:column; gap:2px;}
.nav-group{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.45); padding:14px 10px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; color:rgba(255,255,255,.75); padding:8px 10px; border-radius:9px; cursor:pointer; text-align:left; font-weight:500;}
.nav-item svg{width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14); color:#fff; font-weight:600;}
.nav-item .cnt{margin-left:auto; font-size:11px; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.12); font-variant-numeric:tabular-nums;}
.nav-item .cnt.alert{background:#f2ab3f; color:#2b1d03; font-weight:700;}
.side-foot{padding:12px 14px 16px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:8px; font-size:11.5px;}
.chip-top{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 10px; border-radius:99px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); align-self:flex-start;}
.dot{width:7px; height:7px; border-radius:50%; background:#5be3a6;}
.scrim{position:fixed; inset:0; background:rgba(8,14,30,.45); z-index:35;}
.content{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:10px;}
.topbar h2{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:auto; display:flex; align-items:center; gap:8px; min-width:0;}
.burger{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:6px 8px; cursor:pointer; color:var(--ink);}
.burger svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; display:block;}
.viewas{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim);}
.viewas select{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 8px; max-width:250px;}
.icon-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer;}
.icon-btn:hover{border-color:var(--accent);}
@media (max-width:900px){
  .side{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform .2s ease; padding-top:env(safe-area-inset-top, 0px);}
  .side.open{transform:none;}
  .burger{display:block;}
  .viewas span.lbl{display:none;}
  .viewas select{max-width:150px;}
}

/* ---------- Main ---------- */
main{width:100%; max-width:1500px; margin:0 auto; padding:16px 16px 90px;}
.kpi .ico{margin-left:auto; width:30px; height:30px; border-radius:8px; background:var(--surface-2); display:grid; place-items:center; color:var(--ink-dim);}
.kpi .ico svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.cls{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; font-size:11px; font-weight:700; flex:none;}
.cls.A{background:var(--good-soft); color:var(--good);} .cls.B{background:var(--warn-soft); color:var(--warn);}
.cls.C{background:var(--accent-soft); color:var(--accent);} .cls.D{background:var(--bad-soft); color:var(--bad);}
.cls-row{display:flex; gap:10px; flex-wrap:wrap;}
.cls-box{flex:1 1 90px; border-radius:10px; padding:10px 12px; background:var(--surface-2); display:flex; flex-direction:column; gap:2px;}
.cls-box .v{font-family:var(--f-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;}
.load-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
.load{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; display:flex; flex-direction:column; gap:6px;}
.load .top{display:flex; align-items:center; gap:8px;}
.load .bar{height:6px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
.load .bar span{display:block; height:100%; background:var(--accent);}
.notice{display:flex; gap:10px; align-items:flex-start; background:var(--accent-soft); color:var(--ink); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; margin-bottom:14px;}
.notice b{font-weight:600;}
.notice button{margin-left:auto; flex:none;}
.view-head{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.view-head h1{font-size:20px;}
.view-head p{margin:2px 0 0; color:var(--ink-dim); max-width:70ch;}
.view-head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}

.btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:9px; padding:7px 12px; cursor:pointer; font-weight:500; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent;}
.btn.small{padding:4px 9px; font-size:12px;}
.btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.seg-ctl{display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--surface);}
.seg-ctl button{border:0; background:none; padding:7px 11px; cursor:pointer; color:var(--ink-dim);}
.seg-ctl button.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px; margin-bottom:12px;}
.filters select,.filters input[type=search]{border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:6px 8px; min-width:0; max-width:200px;}
.filters input[type=search]{flex:1 1 180px; max-width:280px;}
.filters label.tg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); cursor:pointer;}
.filters .spacer{flex:1;}

.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.stat .v{font-family:var(--f-display); font-size:20px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat .s{font-size:11.5px; color:var(--ink-dim);}

/* ---------- Board ---------- */
.board-wrap{overflow-x:auto; padding-bottom:8px;}
.board{display:flex; gap:10px; align-items:flex-start; min-height:300px;}
.col{flex:0 0 262px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius); display:flex; flex-direction:column; max-height:72vh;}
.col.drop{outline:2px dashed var(--accent); outline-offset:-3px;}
.col-head{padding:10px 12px 8px; border-bottom:1px solid var(--border-soft);}
.col-title{display:flex; align-items:center; gap:7px; font-weight:600;}
.col-title .bar{width:9px; height:9px; border-radius:3px;}
.col-title .n{margin-left:auto; font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums;}
.col-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px; font-variant-numeric:tabular-nums;}
.col-body{padding:8px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; min-height:60px;}
.col-empty{font-size:12px; color:var(--ink-faint); text-align:center; padding:14px 4px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 10px; cursor:pointer; box-shadow:0 1px 1px rgba(16,26,51,.04); display:flex; flex-direction:column; gap:5px; position:relative;}
.card:hover{border-color:var(--accent);}
.card.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
.card.dragging{opacity:.45;}
.card-top{display:flex; gap:8px; align-items:flex-start;}
.card-top b{font-weight:600; font-size:13px; line-height:1.25; flex:1; min-width:0; overflow-wrap:anywhere;}
.card .meta{font-size:11.5px; color:var(--ink-dim); overflow-wrap:anywhere;}
.chips{display:flex; gap:4px; flex-wrap:wrap;}
.chip{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--cold-soft); color:var(--cold); font-weight:500; white-space:nowrap;}
.chip.good{background:var(--good-soft); color:var(--good);}
.chip.warn{background:var(--warn-soft); color:var(--warn);}
.chip.bad{background:var(--bad-soft); color:var(--bad);}
.chip.acc{background:var(--accent-soft); color:var(--accent);}
.card .foot{display:flex; gap:6px; align-items:center; font-size:11.5px; color:var(--ink-faint);}
.card .foot .val{margin-left:auto; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
.avatar{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; background:var(--surface-3); color:var(--ink-dim);}
.avatar.sdr{background:var(--accent-soft); color:var(--accent);}
.avatar.none{background:var(--warn-soft); color:var(--warn);}
.card input[type=checkbox]{margin:1px 0 0; width:15px; height:15px; accent-color:var(--accent); flex:none;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
table{border-collapse:collapse; width:100%; font-size:12.5px;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--border-soft); white-space:nowrap;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; background:var(--surface-2); position:sticky; top:0;}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.click{cursor:pointer;}
td input[type=checkbox], th input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px;}
.stage-pill{display:inline-flex; align-items:center; gap:6px;}
.stage-pill i{width:8px; height:8px; border-radius:3px; display:inline-block;}

/* ---------- Bulk bar ---------- */
.bulkbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:30; background:var(--ink); color:var(--bg); border-radius:14px; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow-lg); width:min(820px, calc(100% - 32px));}
.bulkbar b{font-variant-numeric:tabular-nums;}
.bulkbar select{background:var(--surface); color:var(--ink); border:0; border-radius:8px; padding:7px 8px; flex:1 1 220px; min-width:0;}
.bulkbar .btn{border-color:transparent;}
.mt-card{margin:0 0 12px;} .mt-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; margin-bottom:10px;} .mt-head h2{margin:0; font-size:15px;} .mt-head span,.mt-sub{color:var(--ink-faint); font-size:12px; font-weight:400;}
.mt-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px;} @media (max-width:900px){ .mt-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
.mt-box{background:var(--surface-2); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; min-width:0;} .mt-box small{color:var(--ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:.04em;} .mt-box b{font-size:18px; font-variant-numeric:tabular-nums;} .mt-box b.ok{color:var(--good);} .mt-box span{font-size:11.5px; color:var(--ink-dim);} .mt-box.hl{background:var(--accent-soft);} .mt-box.hl b{color:var(--accent);}
.mt-bar{height:6px; background:var(--surface-3); border-radius:4px; overflow:hidden;} .mt-bar i{display:block; height:100%;}
.mt-team{margin:0 0 12px;} .mt-team summary{cursor:pointer; font-size:13px;} .mt-team table{margin-top:10px;} .mt-team tfoot th{text-align:left;} .mt-team .r{text-align:right;}
.an-wrap{display:flex; flex-direction:column; gap:10px; margin:8px 0 14px;} .an-yoy{display:flex; gap:18px; align-items:center; flex-wrap:wrap; background:var(--surface-2); border-radius:10px; padding:10px 12px;} .an-yoy small{display:block; color:var(--ink-faint); font-size:11px;} .an-yoy b{font-variant-numeric:tabular-nums;}
.an-wrap .ok{color:var(--good);} .an-wrap .neg{color:var(--bad);} .an-fin{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px;} .an-t{font-weight:600; font-size:13px;} .an-t small{font-weight:400; color:var(--ink-faint);} .an-tab td,.an-tab th{font-size:12px;} .an-tab .r{text-align:right;} .an-cross{margin:0; padding-left:18px; font-size:12.5px; display:flex; flex-direction:column; gap:4px;}
.ger-filtros{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin-bottom:12px;} .ger-filtros label{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:600; min-width:170px; flex:1 1 170px;} .ger-filtros select{text-transform:none; letter-spacing:0; font-weight:400;}
.ger-kpis{grid-template-columns:repeat(4,1fr); margin-bottom:8px;} @media (max-width:860px){ .ger-kpis{grid-template-columns:repeat(2,1fr);} }
.ger-tile{cursor:default;} .ger-tile:hover{background:var(--surface);} .ger-tile.hl .v{color:var(--accent);}
.ger-avisos{display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--ink-dim); margin:0 0 14px;}
.ger-sec{margin-bottom:14px; display:flex; flex-direction:column; gap:12px;} .ger-sec h2{margin:0; font-size:16px;} .ger-sec h2 small{font-weight:400; color:var(--ink-faint); font-size:12px; margin-left:6px;}
.ger-tab td,.ger-tab th{font-size:12.5px;} .ger-tab .r{text-align:right; font-variant-numeric:tabular-nums;} .ger-tab small{color:var(--ink-faint);}
.ger-det summary{cursor:pointer; font-size:13px; font-weight:600; margin-bottom:6px;}
.ger-form{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:flex-start;} .ger-form label{display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; flex:1 1 220px; max-width:340px;} .ger-form .note{font-size:11px; color:var(--ink-faint); font-weight:400;}
.ger-in{width:100%; max-width:180px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; font-variant-numeric:tabular-nums;} .ger-tab .ger-in{max-width:90px; padding:3px 6px; text-align:right;}
.ger-res{display:flex; flex-wrap:wrap; gap:10px 24px; background:var(--surface-2); border-radius:10px; padding:10px 12px;} .ger-res small{display:block; font-size:11px; color:var(--ink-faint);} .ger-res b{font-variant-numeric:tabular-nums;}
.ger-sec .ok{color:var(--good);} .ger-sec .neg{color:var(--bad);}
.ger-verd{padding:10px 12px; border-radius:10px; font-size:13px;} .ger-verd.ok{background:var(--good-soft); color:var(--good);} .ger-verd.neg{background:var(--warn-soft); color:var(--warn);}
.ger-alertas{margin:0; padding-left:18px; font-size:12.5px; color:var(--warn); display:flex; flex-direction:column; gap:4px;}
.ger-cen{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;} @media (max-width:900px){ .ger-cen{grid-template-columns:1fr;} }
.ger-cen-c{background:var(--surface-2); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px;} .ger-cen-c h3{margin:0; font-size:14px;} .ger-cen-c label{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px;} .ger-cen-c .ger-in{max-width:100px; text-align:right;}
.ger-cen-v small{display:block; font-size:11px; color:var(--ink-faint);} .ger-cen-v b{font-size:20px; font-variant-numeric:tabular-nums;} .ger-cen-v span{font-size:11.5px; color:var(--ink-dim);}
.ger-cen-c ul{margin:0; padding-left:16px; font-size:12px; color:var(--ink-dim);} .ger-cen-d{font-size:12.5px; font-weight:600;}
.selall-top{display:flex; align-items:center; gap:12px; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:13px;}
.selall-top label{display:flex; align-items:center; gap:8px; cursor:pointer;}

<script>
/* ======================= DATAS ======================= */
const TODAY = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MONTH_START = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
const MONTH_END = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0);
const MONTH_LABEL = MONTHS[TODAY.getMonth()] + "/" + TODAY.getFullYear();
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pd(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const t=d.getMonth()+n, y=d.getFullYear()+Math.floor(t/12), m=((t%12)+12)%12; const dim=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(d.getDate(),dim)); }
function days(a,b){ return Math.round((a-b)/86400000); }
function fd(s){ const d=pd(s); return d? d.toLocaleDateString("pt-BR") : "—"; }
function fdShort(s){ const d=pd(s); return d? d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) : "—"; }
function money(v){ return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
function moneyK(v){ v=Number(v||0); if(v>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi"; if(v>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil"; return money(v); }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase(); }
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ======================= REGRAS ======================= */
// Regra de inativação por segmento (mesma da Pipeline de Retenção): meses sem comprar até inativar.
// Segmentos que existem no Qlik (mesma lista SEGMENTO_OPTIONS da Pipeline de Retenção, com os nomes como vêm do BI).
const SEG_QLIK = ["VENDA CORPORATIVA CN","LOJISTA OFF CIRÚRGIC","FARMA INDEPENDENTE","COMPRADOR OCASIONAL","GARANTIA/ASSISTÊNCIA",
  "LOJISTA ON","ORG. FILANTRÓPICA","FARMA ASSOC-ASSOCIAD","LOJISTA OFF NÃO CIRÚ","PUBLICO INSTITUIÇÃO","FARMA REDES",
  "HOSPITAIS/CLINICAS","COMPRADOR TERCEIRO","PUBLICO LICITAÇÃO","LOJ. LICITAÇÃO","POSTOS AUTORIZADOS","FARMA DISTRIBUIDOR",
  "FUNERÁRIA","DISTRIBUIDOR CIRÚRGI","FARMA ASSO-ECONOMIZE","Segmento Não Definido","REDE VAREJISTA OFF","VENDEDOR",
  "LOJAS DE BEBÊ","REPRESENTANTE","FARMA ASSOC-ULTRA PO","FARMA ASSOC-INOVA","REDE VAREJISTA ON-1P","FARMA ASSOC-COOPERFA",
  "FARMA ASSOC-ABRAFAD","FARMA ASSOC-REDE F&F","FARMA ASSOC-AGAFARMA","FARMA ASSOC-REDE BEM","FARMA ASSOC-UNIFABRA"];
// Regra de inativação (meses sem comprar) dos segmentos usados nos dados de exemplo.
const SEGS = [
  {n:"FARMA INDEPENDENTE",m:3},{n:"FARMA REDES",m:3},{n:"LOJISTA OFF CIRÚRGIC",m:3},{n:"DISTRIBUIDOR CIRÚRGI",m:3},{n:"LOJISTA ON",m:3},
  {n:"HOSPITAIS/CLINICAS",m:6},{n:"PUBLICO INSTITUIÇÃO",m:6},{n:"LOJISTA OFF NÃO CIRÚ",m:6},
  {n:"COMPRADOR OCASIONAL",m:12},{n:"ORG. FILANTRÓPICA",m:12}
];
const SEG_M = Object.fromEntries(SEGS.map(s=>[s.n,s.m]));
const ORIGENS = [
  {n:"Feira Abradilan 2026",modo:"passiva"},{n:"Site / formulário",modo:"passiva"},{n:"WhatsApp receptivo",modo:"passiva"},
  {n:"Indicação de cliente",modo:"passiva"},{n:"Prospecção ativa (lista)",modo:"ativa"},{n:"LinkedIn / redes",modo:"ativa"},{n:"Importação",modo:"ativa"}
];
const OFENSORES = ["Giro","Estoque","Preço","Concorrência","Sem retorno","Limite de crédito","Mix não aderente","Outro"];
const OF_KIND = {"Preço":"preco","Concorrência":"preco","Estoque":"estoque","Giro":"giro","Sem retorno":"meios","Limite de crédito":"credito","Mix não aderente":"mix","Outro":"outro"};
const LINHAS = ["Home","Health","Ortho","Wellness"];
// Clientes que inativam no mês seguem a Pipeline de Retenção: mesma lista de ofensores, mesmos detalhes e mesmos campos obrigatórios.
const OFENSORES_PIPE = ["Giro","Estoque","Preço","Concorrência","Sem contato","Sem retorno","Inadimplência","Restrição","Limite de crédito","Outros"];
const OF_KIND_PIPE = {"Preço":"preco","Concorrência":"preco","Giro":"giro","Estoque":"estoque","Sem contato":"meios","Sem retorno":"meios"};
const PIPELINE_URL = "https://sandrianemaciel-ship-it.github.io/pipeline-dellamed/";
const ehRisco = it => !!it && it.empresa===undefined && it.pipe==="risco";
const ofListOf = it => ehRisco(it) ? OFENSORES_PIPE : OFENSORES;
const ofKindOf = it => ehRisco(it) ? OF_KIND_PIPE : OF_KIND;
// Enquanto o mês está aberto na Pipeline, o cliente é atualizado por ela (o robô copia de hora em hora) e fica só para leitura no Hub.
const travado = it => !!it && !!it.travaPipeline && it.travaPipeline===CUR_MK;
// "Inativam no mês" e "Inativado" são automáticos, como na Pipeline: passou a data de inativação sem compra, vira Inativado.
function subEtapaRisco(it){ const d = pd(it.dtInat); return d && d<=TODAY ? "Inativado" : "Inativam no mês"; }
const ACOES = ["Promoção","Bonificação","Prazo","Outros"];
// Histórico de CRM: fica gravado no próprio cliente/lead, sem limite, com quem registrou e de quem era a carteira.
// Se o cliente trocar de vendedor ou responsável, o histórico vai junto.
function autorAtual(){ return S.identNome || nameOf(S.viewer); }
function pushCrm(it, texto, d){
  it.crm = it.crm || [];
  it.crm.unshift({d: d || iso(TODAY), t: texto, autor: autorAtual(), resp: nameOf(ownerOf(it))});
}
function crmHtml(it){
  const list = it.crm || [];
  if(!list.length) return `<p class="hint">Nenhum registro de CRM ainda.</p>`;
  const resps = new Set(list.map(c=>c.resp));
  return `${resps.size>1?`<p class="hint">Este cliente já passou por ${resps.size} responsáveis. O histórico completo acompanha o cliente.</p>`:""}
    <ul class="crm">${list.map(c=>`<li><div class="crm-top"><time>${fd(c.d)}</time><b>${esc(c.autor)}</b>${c.resp && c.resp!==c.autor?`<span class="chip">carteira de ${esc(c.resp)}</span>`:""}</div><p>${esc(c.t)}</p></li>`).join("")}</ul>`;
}
const MEIOS = ["WhatsApp","Ligação","Instagram","LinkedIn","Google","Números da fachada","Todas as opções"];
// Temperatura do lead: quente = em Proposta há até 25 dias ou com 1º pedido; morno = sem conversão em até 29 dias do 1º contato
// (ou em Proposta há mais de 25 dias); frio = sem conversão 30 dias ou mais depois do 1º contato. Sem 1º contato, conta da entrada.
const TEMP = {quente:{l:"Quente",c:"bad"}, morno:{l:"Morno",c:"warn"}, frio:{l:"Frio",c:"acc"}};
function temperatura(l){
  if(l.stage==="ganho") return "quente";
  if(l.stage==="desqualificado" || l.stage==="perdido") return "frio";
  if(l.stage==="proposta"){ const d = days(TODAY, pd(l.dtProposta || l.dtEtapa || l.dtEntrada)); return d<=25 ? "quente" : "morno"; }
  const base = pd(l.dt1Contato || l.dtEntrada);
  return days(TODAY, base) >= 30 ? "frio" : "morno";
}

// Funil único da Carteira de clientes (ativos, inativos e inativariam no mês usam as mesmas etapas).
const CART_STAGES = [
  {k:"carteira",label:"Carteira de clientes",color:"var(--cold)"},
  {k:"contato",label:"Contato feito",color:"var(--st1)"},
  {k:"proposta",label:"Proposta enviada",color:"var(--st2)"},
  {k:"negociando",label:"Negociando",color:"var(--st3)"},
  {k:"ganho",label:"Ganho",color:"var(--good)",end:"won",needs:"valor"},
  {k:"perdido",label:"Negociação perdida",color:"var(--bad)",end:"lost",needs:"ofensor"}

/* ======================= BANCO (Firebase Firestore) =======================
   Projeto Firebase só do Hub (separado da Pipeline de Retenção), coleções hub_*.
   A chave do Qlik NÃO fica aqui: quem fala com o Qlik é o robô da pasta sync/, no GitHub Actions. */
// Projeto Firebase próprio do Hub. A configuração (pública, não é segredo) fica em config/firebase-web.json.
let FIREBASE_CONFIG = null;
// E-mails com acesso de gestão enquanto a lista ainda não foi salva no banco.
const GESTORES_PADRAO = ["rodrigo.velho@dellamed.com.br","marco.ribeiro@dellamed.com.br","sandriane.maciel@dellamed.com.br"];
// Organograma comercial (aplicado uma vez no banco; depois a gestão ajusta em Equipe e conversão › Pessoas e acessos).
// acesso: total = todas as carteiras · equipe = a própria e a do time · propria = só a própria.
// O id segue o nome como vem do Qlik, para os clientes caírem na pessoa certa; "alias" cobre grafias diferentes.
const ORGANOGRAMA_V = 1;
// O organograma fica em config/organograma.json (a página e o robô leem o mesmo arquivo).
let ORGANOGRAMA = [];
function aplicarOrganograma(){
  if(DB.organogramaV >= ORGANOGRAMA_V) return false;
  ORGANOGRAMA.forEach(o=>{
    const ex = DB.people.find(p=>p.id===o.id);
    const dados = {...o, origem:"organograma"};
    if(ex) Object.assign(ex, dados); else DB.people.push(dados);
  });
  DB.organogramaV = ORGANOGRAMA_V;
  return true;
}
const COL = {cli:"hub_clientes", lead:"hub_leads", pes:"hub_pessoas", cfg:"hub_config", anexo:"hub_anexos", preset:"hub_presets", hist:"hub_historico", sync:"hub_sync", base:"hub_bases"};
let fdb = null;
const SNAP = new Map(); // última versão gravada/lida de cada registro (para gravar só o que mudou)
const js = o => JSON.stringify(o);
const limpo = o => JSON.parse(JSON.stringify(o)); // tira os "undefined", que o Firestore recusa
function blankDB(){
  return { v:3, clients:[], leads:[], people:[], segmentos: SEG_QLIK.slice(), origens: ORIGENS.map(o=>({...o})),
    metas:{impedir:70, reativar:15, pedido:60, conversao:12}, gestores: GESTORES_PADRAO.slice(), anexos:{}, presets:{}, historico:[], sync:null, anal:{} };
}
function cfgObj(){ return {segmentos:DB.segmentos, origens:DB.origens, metas:DB.metas, gestores:DB.gestores, organogramaV:DB.organogramaV||0}; }
const docCli = d => { const o = d.data(); o.cod = o.cod || d.id; o.id = "c"+d.id; return o; };
const docId = d => ({...d.data(), id:d.id});
const semId = o => { const c = {...o}; delete c.id; return c; };
async function loadAll(){
  const [cs, ls, ps, cfg, hs, st, pr, bs] = await Promise.all([
    Promise.resolve(null), Promise.resolve(null), carregarPessoas(),
    fdb.doc(COL.cfg+"/geral").get(), fdb.collection(COL.hist).where("mk", ">=", (()=>{ const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-6, 1); return iso(d).slice(0,7); })()).get(), fdb.doc(COL.sync+"/status").get(), fdb.collection(COL.preset).get(),
    fdb.collection(COL.base).get().catch(()=>({docs:[]}))]);
  DB = blankDB();
  // Bases fixas dos clientes que inativam no mês (levantadas pelo robô no dia 1, uma por mês).
  DB.bases = {}; bs.docs.forEach(d=>{ DB.bases[d.id] = d.data(); });
  DB.clients = []; // carregados depois do login, só os que a pessoa pode ver (carregarClientes)
  DB.leads = []; // carregados depois do login, junto com os clientes
  DB.people = ps;
  if(cfg.exists){ const c = cfg.data(); ["segmentos","origens","metas","gestores","organogramaV"].forEach(k=>{ if(c[k]) DB[k] = c[k]; }); }
  DB.historico = hs.docs.map(d=>d.data()).filter(h=>h.mk && h.mk < iso(TODAY).slice(0,7)).sort((a,b)=>a.mk.localeCompare(b.mk)).slice(-5);
  DB.sync = st.exists ? st.data() : null;
  pr.docs.forEach(d=>{ DB.presets[d.id] = d.data().lista || []; });
  SNAP.clear();
  DB.clients.forEach(c=>SNAP.set("c:"+c.id, js(c)));
  DB.leads.forEach(l=>SNAP.set("l:"+l.id, js(l)));
  DB.people.forEach(p=>SNAP.set("p:"+p.id, js(p)));
  Object.entries(DB.presets).forEach(([k,v])=>SNAP.set("pr:"+k, js(v)));
  SNAP.set("cfg", js(cfgObj()));
}
let filaGravacao = Promise.resolve();
function saveDB(){ filaGravacao = filaGravacao.then(gravar).catch(e=>{ console.error(e); toast("Não consegui salvar no banco. Confira a internet e tente de novo."); }); }
async function gravar(){
  const ops = [];
  const dif = (k, v, ref, data) => { const j = js(v); if(SNAP.get(k)!==j){ ops.push([ref, data]); SNAP.set(k, j); } };
  DB.clients.forEach(c=> dif("c:"+c.id, c, fdb.doc(COL.cli+"/"+String(c.cod).replace(/\//g,"-")), semId(c)));
  DB.leads.forEach(l=> dif("l:"+l.id, l, fdb.doc(COL.lead+"/"+l.id), semId(l)));
  DB.people.forEach(p=> dif("p:"+p.id, p, fdb.doc(COL.pes+"/"+p.id), semId(p)));
  dif("cfg", cfgObj(), fdb.doc(COL.cfg+"/geral"), cfgObj());
  Object.entries(DB.presets).forEach(([k,v])=> dif("pr:"+k, v, fdb.doc(COL.preset+"/"+k), {lista:v}));
  Object.entries(DB.anexos).forEach(([id,a])=>{ if(!SNAP.has("a:"+id)){ ops.push([fdb.doc(COL.anexo+"/"+id), a]); SNAP.set("a:"+id, "1"); } });
  for(let i=0;i<ops.length;i+=400){ const b = fdb.batch(); ops.slice(i,i+400).forEach(([ref,data])=>b.set(ref, comUpd(ref, limpo(data)))); await b.commit(); }
}
// Clientes e leads gravados levam "upd" (hora do servidor): os outros aparelhos baixam só o que mudou.
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
const toMs = v => v && typeof v.toMillis==="function" ? v.toMillis() : v;
function comUpd(ref, data){ const p = ref.path||""; return (p.startsWith(COL.cli+"/") || p.startsWith(COL.lead+"/") || p.startsWith(COL.pes+"/")) ? Object.assign(data, {upd: TS()}) : data; }
// Pessoas: cópia no aparelho + só as alteradas depois dela.
async function carregarPessoas(){
  let c = await IDB.get("pessoas");
  const juntar = qs => qs.docs.forEach(d=>{ const o = {...d.data(), id:d.id}; o.upd = toMs(o.upd); c.itens[o.id] = o; if(o.upd && o.upd > (c.wm||0)) c.wm = o.upd; });
  if(c && c.itens) juntar(await fdb.collection(COL.pes).where("upd", ">", firebase.firestore.Timestamp.fromMillis(c.wm||0)).get());
  else { c = { wm:0, itens:{} }; juntar(await fdb.collection(COL.pes).get()); }
  S.pesWm = c.wm; IDB.set("pessoas", c);
  return Object.values(c.itens).map(p=>({...p}));
}

// Clientes: a gestão carrega a carteira inteira; líderes e vendedores, só as carteiras que podem ver
// (consultas "vend in [...]", de 30 em 30). Assim cada pessoa lê do banco só o que vai usar.
function consultasDeClientes(){
  const col = fdb.collection(COL.cli);
  if(S.identAcc==="gestor") return [col];
  const me = person(S.identAcc);
  const ids = DB.people.filter(p=> p.id===S.identAcc || (me && me.acesso==="equipe" && me.time && p.time===me.time)).map(p=>p.id);
  const qs = []; for(let i=0;i<ids.length;i+=30) qs.push(col.where("vend","in",ids.slice(i,i+30)));
  return qs;
}
// Plano gratuito do Firebase (50 mil leituras por dia): cada documento é lido UMA vez por abertura da página.
// A primeira resposta do "ouvinte" em tempo real já é a carga inicial; depois só chegam as mudanças.
function escutar(consulta, prefixo, conv, lista){
  return new Promise(resolve=>{
    let primeira = true;
    consulta.onSnapshot(qs=>{
      let mudou = false;
      qs.docChanges().forEach(ch=>{
        if(ch.doc.metadata.hasPendingWrites) return;
        const o = conv(ch.doc); const k = prefixo+o.id; const arr = lista();
        const i = arr.findIndex(x=>x.id===o.id);
        if(ch.type==="removed"){ if(i>=0){ arr.splice(i,1); mudou = true; } SNAP.delete(k); return; }
        const j = js(o); if(SNAP.get(k)===j) return;
        SNAP.set(k, j); if(i>=0) arr[i] = o; else arr.push(o); mudou = true;
      });
      if(primeira){ primeira = false; resolve(); } else if(mudou) renderQuandoLivre();
    }, err=>{ console.error(err); if(primeira){ primeira = false; resolve(); } });
  });
}
/* ---------- Carteira em pacotes + cópia no aparelho (economia de leituras do Firebase) ----------
   1) Lê hub_sync/pacotes (1 leitura): diz quais pacotes existem e quando foram montados (uma vez por dia, pelo robô).
   2) Se o aparelho já tem a carteira daquela montagem, usa a cópia local; senão baixa só os pacotes de quem a pessoa pode ver.
   3) Depois busca apenas os clientes com "upd" mais novo que o que já tem (o que o robô ou a equipe mudou).
   Sem hub_sync/pacotes (robô ainda não montou), volta ao modo anterior: lê cliente por cliente. */
const IDB = (()=>{ let p = null;
  const abrir = () => p || (p = new Promise(res=>{ try{ const r = indexedDB.open("hub-comercial", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("kv"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null); }catch(e){ res(null); } }));
  return {
    get: async k => { const db = await abrir(); if(!db) return null; return new Promise(res=>{ try{ const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = ()=>res(t.result ?? null); t.onerror = ()=>res(null); }catch(e){ res(null); } }); },
    set: async (k, v) => { const db = await abrir(); if(!db) return; return new Promise(res=>{ try{ const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); }catch(e){ res(); } }); }
  };
})();
const slugVend = v => String(v||"sem-vendedor").toLowerCase().replace(/[^a-z0-9-]+/g,"-").slice(0,60) || "sem-vendedor";

  if(S.identAcc==="gestor") return null; // todos
  const me = person(S.identAcc);
  return new Set(DB.people.filter(p=> p.id===S.identAcc || (me && me.acesso==="equipe" && me.time && p.time===me.time)).map(p=>p.id));
}
const resumoAnalise = a => a ? { pot: a.pot||null, dia: a.dia||null } : null;
function cliDoPacote(o){ const c = {...o}; const id = c._id; delete c._id; c.cod = c.cod || id; c.id = "c"+id; return c; }
function cliDoDoc(d){ const o = d.data(); Object.keys(o).forEach(k=>{ o[k] = toMs(o[k]); }); o.analise = resumoAnalise(o.analise); o.cod = o.cod || d.id; o.id = "c"+d.id; return o; }
let salvarCacheT = null;
function salvarCache(){ clearTimeout(salvarCacheT); salvarCacheT = setTimeout(()=>{ if(S.cacheCli) IDB.set(S.cacheCli.chave, S.cacheCli); if(S.cacheLeads) IDB.set("leads", S.cacheLeads); }, 1500); }
async function carregarClientes(){
  let pac = null;
  try{ const d = await fdb.doc(COL.sync+"/pacotes").get(); pac = d.exists ? d.data() : null; }catch(e){ console.error(e); }
  if(!pac || !pac.indice || !pac.builtAt){
    S.modoPacotes = false;
    await Promise.all(consultasDeClientes().map(q=> escutar(q, "c:", docCli, ()=>DB.clients)).concat([carregarLeads()]));
    if(S.identAcc==="gestor") gravarHistoricoDoMes();
    return;
  }
  S.modoPacotes = true; DB.pac = pac;
  const vis = idsVisiveis();
  const vends = Object.keys(pac.indice).filter(v=> !vis || [...vis].some(id=>slugVend(id)===v)).sort();
  const chave = "cli:"+(S.identAcc||"");
  let cache = await IDB.get(chave);
  const ids = vends.flatMap(v=>pac.indice[v]||[]);
  if(!cache || cache.builtAt!==pac.builtAt || cache.escopo!==vends.join(",")){
    const docs = await Promise.all(ids.map(id=>fdb.doc(COL.sync+"/"+id).get()));
    const clientes = {}; docs.forEach(d=>{ if(d.exists) (d.data().itens||[]).forEach(o=>{ clientes[o._id] = o; }); });
    cache = { chave, builtAt:pac.builtAt, escopo:vends.join(","), wm:pac.builtAt, clientes };
    S.pacInfo = { baixados:ids.length, total:ids.length };
  } else S.pacInfo = { baixados:0, total:ids.length };
  Object.keys(pac.removidos||{}).forEach(id=>{ delete cache.clientes[id]; });
  S.cacheCli = cache;
  DB.clients = Object.values(cache.clientes).map(cliDoPacote).filter(c=> !vis || vis.has(c.vend));
  DB.clients.forEach(c=>SNAP.set("c:"+c.id, js(c)));
  await Promise.all([escutarMudancasClientes(cache, vis), carregarLeads()]);
  salvarCache(); renderSyncChip();
  if(S.identAcc==="gestor") gravarHistoricoDoMes();
}
// Só os clientes alterados depois do que o aparelho já tem (upd > marca d'água).
function escutarMudancasClientes(cache, vis){
  return new Promise(resolve=>{
    let primeira = true; const desde = cache.wm;
    fdb.collection(COL.cli).where("upd", ">", firebase.firestore.Timestamp.fromMillis(desde)).onSnapshot(qs=>{
      let mudou = false; S.pacInfo = Object.assign(S.pacInfo||{}, { mudancas:qs.size });
      qs.docChanges().forEach(ch=>{
        if(ch.doc.metadata.hasPendingWrites || ch.type==="removed") return;
        const o = cliDoDoc(ch.doc); const pid = ch.doc.id; const k = "c:"+o.id;
        const ant = cache.clientes[pid];
        if(ant && ant.analise && (!o.analise || String(ant.analise.dia||"") > String(o.analise.dia||""))) o.analise = ant.analise; // o pacote do dia tem a análise mais nova
        if(o.upd > cache.wm) cache.wm = o.upd;
        const i = DB.clients.findIndex(x=>x.id===o.id);
        if(vis && !vis.has(o.vend)){ delete cache.clientes[pid]; if(i>=0){ DB.clients.splice(i,1); mudou = true; } SNAP.delete(k); return; }
        const plano = {...o, _id:pid}; delete plano.id; cache.clientes[pid] = plano;
        const j = js(o); if(SNAP.get(k)===j) return;
        SNAP.set(k, j); if(i>=0) DB.clients[i] = o; else DB.clients.push(o); mudou = true;
      });
      salvarCache();
      if(primeira){ primeira = false; resolve(); } else if(mudou) renderQuandoLivre();
    }, err=>{ console.error(err); if(primeira){ primeira = false; resolve(); } });
  });
}
// Leads: cópia no aparelho + só os alterados depois dela. Lead excluído fica marcado ("excluido") e some de todos os aparelhos.
async function carregarLeads(){
  let cache = await IDB.get("leads");
  const aplicar = (qs, cache) => { let mudou = false;
    qs.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites) return;
      const o = {...ch.doc.data(), id:ch.doc.id}; o.upd = toMs(o.upd); const k = "l:"+o.id;
      const i = DB.leads.findIndex(x=>x.id===o.id);
      if(o.upd && o.upd > (cache.wm||0)) cache.wm = o.upd;
      if(ch.type==="removed" || o.excluido){ delete cache.leads[o.id]; if(i>=0){ DB.leads.splice(i,1); mudou = true; } SNAP.delete(k); return; }
      cache.leads[o.id] = o;
      const j = js(o); if(SNAP.get(k)===j) return;
      SNAP.set(k, j); if(i>=0) DB.leads[i] = o; else DB.leads.push(o); mudou = true;
    });
    salvarCache(); return mudou; };
  const consulta = cache && cache.leads ? fdb.collection(COL.lead).where("upd", ">", firebase.firestore.Timestamp.fromMillis(cache.wm||0)) : fdb.collection(COL.lead);
  if(cache && cache.leads){ DB.leads = Object.values(cache.leads).map(l=>({...l})); DB.leads.forEach(l=>SNAP.set("l:"+l.id, js(l))); }
  else cache = { wm:0, leads:{} };
  S.cacheLeads = cache;
  return new Promise(resolve=>{ let primeira = true;
    consulta.onSnapshot(qs=>{ const m = aplicar(qs, cache); if(primeira){ primeira = false; resolve(); } else if(m) renderQuandoLivre(); },
      err=>{ console.error(err); if(primeira){ primeira = false; resolve(); } });
  });
}
// Análise comercial completa (mix, insight, série mensal): pacotes próprios, baixados só quando precisa (DB.anal).
const anCarregado = new Set(); const anCarregando = new Map();
function analiseDe(c){ if(!c) return null; const id = String(c.id||"").slice(1); return (DB.anal||{})[id] || c.analise || null; }
function analiseCompleta(c){ const a = analiseDe(c); return !!(a && (a.mix || a.serie || a.fin)); }
function garantirAnalise(vends){
  const pac = DB.pac; if(!S.modoPacotes || !pac || !pac.anIndice) return Promise.resolve(false);
  const falta = [...new Set(vends)].filter(v=>!anCarregado.has(v) && pac.anIndice[v]);
  if(!falta.length) return Promise.resolve(false);
  return Promise.all(falta.map(v=>{
    if(anCarregando.has(v)) return anCarregando.get(v);
    const pr = (async ()=>{
      let c = await IDB.get("an:"+v);
      if(!c || c.dia!==pac.anDia){
        const docs = await Promise.all((pac.anIndice[v]||[]).map(id=>fdb.doc(COL.sync+"/"+id).get()));
        const itens = {}; docs.forEach(d=>{ if(d.exists) Object.assign(itens, d.data().itens||{}); });
        c = { dia:pac.anDia, itens }; IDB.set("an:"+v, c);
      }
      Object.assign(DB.anal, c.itens); anCarregado.add(v);
    })().catch(e=>console.error(e));
    anCarregando.set(v, pr); return pr;
  })).then(()=>true);
}
// O resultado do mês (gráfico de evolução do Dashboard) é registrado quando alguém da gestão abre o Hub.
function gravarHistoricoDoMes(){
  const mk = iso(TODAY).slice(0,7); let recuperado = 0, reativado = 0, primeiros = 0;
  DB.clients.forEach(c=>{ if(c.stage==="ganho" && (c.dtEtapa||"").startsWith(mk)){ if(c.pipe==="risco") recuperado += Number(c.valor)||0; else if(c.pipe==="inativo") reativado += Number(c.valor)||0; } });
  DB.leads.forEach(l=>{ if(l.stage==="ganho" && (l.dtGanho||"").startsWith(mk)) primeiros += Number(l.valor)||0; });
  fdb.doc(COL.hist+"/"+mk).set({mk, recuperado, reativado, primeiros, atualizadoEm:new Date().toISOString()}).catch(e=>console.error(e));
}
// Atualização em tempo real: o que outra pessoa ou o robô do Qlik gravar aparece sem recarregar a página.
let ouvindo = false;
function ouvir(){
  if(ouvindo) return; ouvindo = true;
  const acompanhar = (col, prefixo, conv, lista) => (typeof col==="string" ? fdb.collection(col) : col).onSnapshot(qs=>{
    let mudou = false;
    qs.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites) return;
      const o = conv(ch.doc); const k = prefixo+o.id; const arr = lista();
      const i = arr.findIndex(x=>x.id===o.id);
      if(ch.type==="removed"){ if(i>=0){ arr.splice(i,1); mudou = true; } SNAP.delete(k); return; }
      const j = js(o); if(SNAP.get(k)===j) return;
      SNAP.set(k, j); if(i>=0) arr[i] = o; else arr.push(o); mudou = true;
    });
    if(mudou) renderQuandoLivre();
  }, err=>console.error(err));
  acompanhar(fdb.collection(COL.pes).where("upd", ">", firebase.firestore.Timestamp.fromMillis(S.pesWm||0)), "p:", d=>{ const o = docId(d); o.upd = toMs(o.upd); return o; }, ()=>DB.people);
  fdb.doc(COL.sync+"/status").onSnapshot(d=>{ DB.sync = d.exists ? d.data() : null; renderSyncChip(); });
  fdb.doc(COL.sync+"/metas").onSnapshot(d=>{ DB.metasQlik = d.exists ? d.data() : null; if(S.view==="carteira") renderQuandoLivre(); }, ()=>{});
}
function renderQuandoLivre(){ if($("#overlay").hidden && !$("#gfpop")) render(); else S.renderPendente = true; }
function renderSyncChip(){
  const el = $("#syncChip"); if(!el) return;
  const st = DB.sync;
  let cor = "#f2ab3f", txt = "Qlik · aguardando a 1ª sincronização", tip = "A carteira é preenchida pelo robô de sincronização (GitHub Actions).";
  if(st && st.erro){ cor = "#ff6b76"; txt = "Qlik · falha na última sincronização"; tip = st.erro; }
  else if(st && st.ultimaSync){ cor = "#5be3a6"; const d = new Date(st.ultimaSync); txt = "Qlik · atualizado "+d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); tip = `${st.clientes||0} clientes lidos na última sincronização.`; }
  if(S.modoPacotes && S.pacInfo){ const pi = S.pacInfo; tip += ` · Carteira: ${pi.baixados? `${pi.baixados} de ${pi.total} pacotes baixados agora` : `${pi.total} pacotes já guardados neste aparelho`}${pi.mudancas!=null?`, ${pi.mudancas} clientes alterados desde a montagem do dia`:""}.`; }
  el.innerHTML = `<span class="dot" style="background:${cor}"></span>${esc(txt)}`; el.title = tip;
}

// Donos de carteira: vendedores, líderes (carteira própria) e reativadores.
const sellers = () => DB.people.filter(p=>["vendedor","lider","reativador"].includes(p.papel));
const sdrs = () => DB.people.filter(p=>p.papel==="sdr");
const teams = () => Array.from(new Set(DB.people.map(p=>p.time)));
function viewerRole(){ if(S.viewer==="gestor") return "gestor"; const p=person(S.viewer); if(!p) return "gestor"; return p.papel==="sdr" ? "sdr" : "vendedor"; }
// Regra de acesso do organograma: total vê tudo; equipe vê a própria carteira e a do seu time; própria vê só a sua.
function podeVer(owner){
  if(isGestor()) return true;
  if(owner && owner===S.viewer) return true;
  const v = person(S.viewer);
  if(v && v.acesso==="equipe" && owner){ const o = person(owner); return !!o && !!v.time && o.time===v.time; }
  return false;
}
// Para o "Ver como": a gestão escolhe qualquer pessoa; o líder com acesso de equipe escolhe ele mesmo ou alguém do time.
function podeVerComo(id){
  if(S.identAcc==="gestor") return true;
  const me = person(S.identAcc); if(!me) return false;
  if(id===me.id) return true;
  if(me.acesso!=="equipe") return false;
  const o = person(id); return !!o && o.time===me.time;
}
const isGestor = () => viewerRole()==="gestor";
// Excluir leads: gestão (acesso total) e líderes (acesso de equipe), só nos leads que eles enxergam.
function podeExcluirLeads(){ if(S.identAcc==="gestor") return true; const me = person(S.identAcc); return !!me && me.acesso==="equipe"; }
function podeExcluirLead(l){ return !!l && l.empresa!==undefined && podeExcluirLeads() && (S.identAcc==="gestor" || !l.owner || podeVer(l.owner)); }
// Quem pode entrar no modo de seleção nesta tela (atribuir = gestão; excluir leads = gestão e líderes).
function podeSelecionar(pk){ return isGestor() || ((pk==="prospeccao" || pk==="distribuicao") && podeExcluirLeads()); }

function visibleClients(pk){
  return DB.clients.filter(c=> (!PIPES[pk].pipe || c.pipe===PIPES[pk].pipe) && podeVer(c.vend) && gfOk(c));
}
function visibleLeads(){ return DB.leads.filter(l=> podeVer(l.owner) && gfOk(l)); }
function itemsOf(pk){ return PIPES[pk].kind==="lead" ? visibleLeads() : visibleClients(pk); }
function ownerOf(item){ return item.owner!==undefined ? item.owner : item.vend; }
function findItem(id){ return DB.clients.find(c=>c.id===id) || DB.leads.find(l=>l.id===id); }
function pkOfItem(it){ return it.empresa!==undefined ? "prospeccao" : pipeKeyOfClient(it); }

function applyFilters(pk, list){
  const f = F(pk);
  const q = norm(f.q);
  return list.filter(it=>{
    const own = ownerOf(it); const p = person(own);
    if(f.time && (!p || p.time!==f.time)) return false;
    if(f.owner && own!==f.owner) return false;
    if(f.seg && it.seg!==f.seg) return false;
    if(f.uf && it.uf!==f.uf) return false;
    if(f.origem && it.origem!==f.origem) return false;
    if(f.modo && it.modo!==f.modo) return false;
    if(f.temp && temperatura(it)!==f.temp) return false;
    if(f.semDono && own) return false;
    if(f.atraso && !(it.prox && pd(it.prox) < TODAY)) return false;
    if(q){ const hay = norm([it.cli,it.empresa,it.cod,it.cnpj,it.cid,it.contato,nameOf(own)].join(" ")); if(!hay.includes(q)) return false; }
    return true;
  });
}

/* ---------- Metas do mês (Qlik: Vendas/Faturamento Times - Agrupada) ---------- */
// Meta mês = Meta Comercial · Meta Ortho = 10% da Meta Comercial · por dia = falta ÷ dias úteis restantes (seg-sex, sem feriados, contando hoje).
function diasUteisRest(ref){ const d = new Date(ref), fim = new Date(d.getFullYear(), d.getMonth()+1, 0); let n = 0; for(; d<=fim; d.setDate(d.getDate()+1)){ const w = d.getDay(); if(w && w!==6) n++; } return n; }
function contaMeta(m, du){
  const pctO = (DB.metasQlik && DB.metasQlik.metaOrthoPct) || 0.1;
  const metaO = m.meta*pctO, falta = m.meta-m.vendido, faltaO = metaO-m.vendOrtho;
  return { meta:m.meta, vendido:m.vendido, falta, pct: m.meta? m.vendido/m.meta : 0, dia: du? Math.max(0,falta)/du : 0, metaO, vendO:m.vendOrtho, faltaO, pctO: metaO? m.vendOrtho/metaO : 0, diaO: du? Math.max(0,faltaO)/du : 0 };
}
function metasMes(){ const M = DB.metasQlik; return M && M.mes===CUR_MK ? M : null; }
function barraMeta(p){ const v = Math.max(0, Math.min(1, p||0)); const cor = v>=1 ? "var(--good)" : v>=0.7 ? "var(--accent)" : v>=0.4 ? "var(--warn)" : "var(--bad)"; return `<div class="mt-bar"><i style="width:${(v*100).toFixed(1)}%;background:${cor}"></i></div>`; }

    h += `<section class="panel mt-card" aria-label="Minha meta do mês"><div class="mt-head"><h2>Minha meta · ${mkLabel(CUR_MK)}</h2><span>${du} ${du===1?"dia útil":"dias úteis"} restantes · Qlik ${fdt(M.em)}</span></div>
      <div class="mt-grid">
        <div class="mt-box"><small>Meta mês</small><b>${money(c.meta)}</b>${barraMeta(c.pct)}<span>Realizado ${money(c.vendido)} · ${Math.round(c.pct*100)}%</span></div>
        <div class="mt-box"><small>Falta p/ meta</small><b class="${c.falta<=0?"ok":""}">${c.falta<=0?"Meta batida":money(c.falta)}</b><span>${c.falta<=0?`${money(-c.falta)} acima da meta`:"pedidos (- cancelados) no mês"}</span></div>
        <div class="mt-box hl"><small>Vender por dia</small><b>${money(c.dia)}</b><span>falta ÷ ${du} dias úteis</span></div>
        <div class="mt-box"><small>Meta Ortho (10%)</small><b>${money(c.metaO)}</b>${barraMeta(c.pctO)}<span>Realizado Ortho ${money(c.vendO)} · ${Math.round(c.pctO*100)}%</span></div>
        <div class="mt-box hl"><small>Ortho por dia</small><b>${money(c.diaO)}</b><span>${c.faltaO<=0?"meta Ortho batida":`falta ${money(c.faltaO)} ÷ ${du} dias`}</span></div>
      </div></section>`;
  }
  // Líderes (acesso de equipe) veem o time; a gestão vê todos, respeitando os filtros de time e vendedor.
  const lider = me && me.acesso==="equipe";
  if(S.viewer==="gestor" || lider){
    let ids = Object.keys(M.porPessoa||{}).filter(id=> (M.porPessoa[id].meta>0) && person(id));
    if(lider) ids = ids.filter(id=> person(id).time===me.time);

      const tot = linhas.reduce((a,l)=>({ meta:a.meta+l.c.meta, vendido:a.vendido+l.c.vendido, vendOrtho:a.vendOrtho+l.c.vendO }), {meta:0, vendido:0, vendOrtho:0});
      const T = contaMeta(tot, du);
      const aberto = S.metasAbertas!==false;
      h += `<details class="panel mt-team"${aberto?" open":""} data-metas-toggle="1"><summary><b>${lider?"Metas do meu time":"Metas por vendedor"}</b> · ${linhas.length} ${linhas.length===1?"pessoa":"pessoas"} · ${Math.round(T.pct*100)}% da meta · falta ${money(Math.max(0,T.falta))} (${money(T.dia)}/dia) · Ortho ${Math.round(T.pctO*100)}% <span class="mt-sub">${du} dias úteis restantes</span></summary>

        </tbody><tfoot><tr><th>Total</th><th></th><th class="r">${money(T.meta)}</th><th class="r">${money(T.vendido)}</th><th>${Math.round(T.pct*100)}%</th><th class="r">${money(Math.max(0,T.falta))}</th><th class="r">${money(T.dia)}</th><th class="r">${money(T.metaO)}</th><th class="r">${money(T.vendO)}</th><th class="r">${money(T.diaO)}</th></tr></tfoot></table></div></details>`;
    }
  }
  return h;

function fdt(iso){ if(!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }

/* ---------- Análise do cliente (Qlik: Potenciais x Não Comprou x Deficitários e Pasta Mestre) ---------- */

/* ======================= VISÃO GERENCIAL (líderes, supervisores e gerentes) =======================
   Só leitura: nada aqui grava no banco. Os parâmetros dos simuladores ficam apenas na memória da página.
   Base: série mensal por cliente lida do Qlik pelo robô (analise.serie):
     [0] mesmo mês do ano passado · [1..6] os 6 meses fechados anteriores · [7] mês atual (parcial).
   Faturamento = NF de venda - devolução · Pedidos = Valor Total de Pedidos (- Canc) · Nº pedidos = pedidos distintos. */
const GER0 = { time:"", vend:"", ref:"3m", met:"ped", meta:null, g:10, gVend:{}, gCli:{}, cap:15, dist:"prop", tNovo:null, tReat:null, mixN:50,
  cen:{ cons:{g:3, n:null, r:null}, real:{g:8, n:null, r:null}, agre:{g:15, n:null, r:null} } };
function gerS(){ if(!S.ger) S.ger = JSON.parse(JSON.stringify(GER0)); return S.ger; }
const GER_REF = { "3m":{l:"Média dos 3 últimos meses fechados", idx:[4,5,6]}, "6m":{l:"Média dos 6 últimos meses fechados", idx:[1,2,3,4,5,6]}, "ly":{l:"Mesmo mês do ano passado", idx:[0]} };
const GER_MET = { ped:"Pedidos (R$)", fat:"Faturamento (R$)" };
function podeGerencial(){ if(S.viewer==="gestor") return true; const p = person(S.viewer); return !!p && p.acesso==="equipe"; }
function mkCurto(mk){ if(!mk) return "—"; const [y,m] = mk.split("-").map(Number); return MONTHS[m-1].slice(0,3)+"/"+String(y).slice(2); }
const nInt = v => Math.round(v||0).toLocaleString("pt-BR");
const pctTxt = (v, d=0) => v==null || !isFinite(v) ? "—" : (v*100).toLocaleString("pt-BR",{maximumFractionDigits:d, minimumFractionDigits:d})+"%";

// Clientes da carteira selecionada (respeita o acesso de quem está vendo).
function gerClientes(){
  const G = gerS();
  return DB.clients.filter(c=>{
    if(!c.vend || !podeVer(c.vend)) return false;
    const p = person(c.vend); if(!p) return false;
    if(G.time && p.time!==G.time) return false;
    if(G.vend && c.vend!==G.vend) return false;
    return true;
  });
}
// Números de um cliente na métrica e no período de referência escolhidos.
function gerNum(c, G){
  const s = analiseDe(c) && analiseDe(c).serie; const ref = GER_REF[G.ref];
  if(!s || !s.meses || !(s[G.met]||[]).length) return { ok:false, ref:0, np:0, comp:0, real:0, npReal:0, pico:0, meses:[] };
  const arr = s[G.met], np = s.np || [];
  const ref0 = ref.idx.reduce((a,i)=>a+(arr[i]||0),0)/ref.idx.length;
  const npRef = ref.idx.reduce((a,i)=>a+(np[i]||0),0)/ref.idx.length;
  const comp = ref.idx.filter(i=>(arr[i]||0)>0).length/ref.idx.length; // fração dos meses com compra
  // Realizado no mês: pedidos de hora em hora (pedMes); faturamento pela série diária.
  const real = G.met==="ped" && c.pedMes!=null ? c.pedMes : (arr[7]||0);
  const pico = Math.max(0, ...arr.slice(0,7).map(v=>v||0));
  return { ok:true, ref:Math.max(0,ref0), np:npRef, comp, real, npReal:np[7]||0, pico, meses:s.meses };
}
const noMes = (iso, mk) => !!iso && iso.slice(0,7)===mk;

// Agregados de um conjunto de clientes.
function gerAgg(lista, G){
  const a = { cli:lista.length, ativos:0, risco:0, inativos:0, reat:0, novos:0, ref:0, np:0, compr:0, real:0, npReal:0, headroom:0, semSerie:0, vends:new Set(), retomada:0 };
  for(const c of lista){
    a.vends.add(c.vend);
    if(c.pipe==="ativo") a.ativos++; else if(c.pipe==="risco") a.risco++; else a.inativos++;
    const s = analiseDe(c) && analiseDe(c).serie;
    if(s && noMes(s.dtReat, CUR_MK)) a.reat++;
    if(s && noMes(s.dtPri, CUR_MK)) a.novos++;
    const n = gerNum(c, G); if(!n.ok){ a.semSerie++; continue; }
    a.ref += n.ref; a.np += n.np; a.compr += n.comp; a.real += n.real; a.npReal += n.npReal;
    a.headroom += Math.max(0, n.pico - n.ref);
    const p = analiseDe(c) && analiseDe(c).pot; if(p && G.met==="ped" && p.v25>p.v26){ const fim = String(p.per||"").split("-")[1]; const meses = (fim && MONTHS.findIndex(m=>m.startsWith(fim))+1) || 9; a.retomada += (p.v25-p.v26)/meses; }
  }
  a.ticketCli = a.compr ? a.ref/a.compr : 0;  // por cliente comprador no mês
  a.ticketPed = a.np ? a.ref/a.np : 0;         // por pedido
  return a;
}
function metaQlikDe(vendIds){ const M = metasMes(); if(!M) return null; let t = 0, ok = false; vendIds.forEach(id=>{ const m = M.porPessoa && M.porPessoa[id]; if(m && m.meta>0){ t += m.meta; ok = true; } }); return ok ? t : null; }

// Ticket de referência para novos clientes e reativações, a partir do histórico real.
function gerTickets(lista, G){
  const novos = [], reat = [], inat = [];
  for(const c of lista){
    const s = analiseDe(c) && analiseDe(c).serie; if(!s || !s.meses) continue;
    const arr = s[G.met] || [];
    // média mensal do cliente do mês da entrada (ou reativação) até o último mês fechado
    const media = desde => { const i0 = s.meses.findIndex((mk,i)=>i>=1 && mk>=desde); if(i0<1) return null; const v = arr.slice(i0,7); return v.length ? v.reduce((a,b)=>a+(b||0),0)/v.length : null; };
    if(s.dtPri && s.dtPri.slice(0,7)>=s.meses[1] && s.dtPri.slice(0,7)<CUR_MK){ const m = media(s.dtPri.slice(0,7)); if(m>0) novos.push(m); }
    if(s.dtReat && s.dtReat.slice(0,7)>=s.meses[1] && s.dtReat.slice(0,7)<CUR_MK){ const m = media(s.dtReat.slice(0,7)); if(m>0) reat.push(m); }
    const pt = analiseDe(c) && analiseDe(c).pot; if(c.pipe==="inativo" && pt && pt.v25>0 && G.met==="ped") inat.push(pt.v25/9);
  }
  const med = a => { if(!a.length) return null; const s = a.slice().sort((x,y)=>x-y); const k = Math.floor(s.length/2); return s.length%2 ? s[k] : (s[k-1]+s[k])/2; };
  const tn = med(novos), tr = med(reat) || med(inat);
  return { tNovo:tn, fonteN: tn ? `mediana de ${novos.length} clientes novos dos últimos 6 meses` : null,
    tReat:tr, fonteR: med(reat) ? `mediana de ${reat.length} clientes reativados dos últimos 6 meses` : (med(inat) ? `média mensal de 2025 de ${inat.length} clientes hoje inativos` : null), poolInat: lista.filter(c=>c.pipe==="inativo").length };
}

function gerInput(k, v, extra=""){ return `<input class="ger-in" type="number" data-ger="${k}" value="${v==null?"":Math.round(v*100)/100}" ${extra}>`; }
function gerTile(k, v, s, cls=""){ return `<div class="kpi2 ger-tile ${cls}"><span class="k">${k}</span><span class="v num">${v}</span><span class="s">${s||""}</span></div>`; }

function renderGerencial(){
  if(!podeGerencial()) return `<div class="view-head"><div><h1>Visão gerencial</h1><p>Disponível para líderes, supervisores e gerentes.</p></div></div>`;
  const G = gerS();
  const lista = gerClientes();
  if(S.modoPacotes){
    const vs = [...new Set(lista.map(c=>slugVend(c.vend)))];
    if(vs.some(v=>!anCarregado.has(v) && DB.pac && DB.pac.anIndice && DB.pac.anIndice[v])){
      garantirAnalise(vs).then(()=>{ if(S.view==="gerencial") render(); });
      return `<div class="view-head"><div><h1>Visão gerencial da carteira</h1><p>Carregando o histórico mensal da carteira… (baixado uma vez por dia e guardado neste aparelho)</p></div></div>`;
    }
  }
  const A = gerAgg(lista, G);
  const tk = gerTickets(lista, G);
  const comSerie = lista.find(c=>{ const a = analiseDe(c); return a && a.serie && a.serie.meses; });
  const meses = comSerie ? analiseDe(comSerie).serie.meses : [];
  const refMeses = GER_REF[G.ref].idx.map(i=>meses[i]).filter(Boolean);
  const refLbl = refMeses.length ? (refMeses.length===1 ? mkCurto(refMeses[0]) : `${mkCurto(refMeses[0])} a ${mkCurto(refMeses[refMeses.length-1])}`) : "sem dados";
  const comDia = lista.find(c=>analiseDe(c) && analiseDe(c).dia); const atual = comDia ? analiseDe(comDia).dia : null;
  const vendIds = Array.from(A.vends);
  const metaQ = metaQlikDe(vendIds);
  const meta = G.meta!=null ? G.meta : (metaQ||0);
  const L = GER_MET[G.met].replace(" (R$)","").toLowerCase();

  // Opções de filtro: times e vendedores visíveis.
  const pessoas = DB.people.filter(p=>p.papel!=="gestor" && p.papel!=="sdr" && podeVer(p.id) && DB.clients.some(c=>c.vend===p.id));
  const times = Array.from(new Set(pessoas.map(p=>p.time).filter(Boolean))).sort();
  const vends = pessoas.filter(p=>!G.time || p.time===G.time).sort((a,b)=>a.nome.localeCompare(b.nome));

  let h = `<div class="view-head"><div><h1>Visão gerencial da carteira</h1><p>Simulações de crescimento, meta e cenários. <b>Nada aqui altera a carteira</b>: os valores digitados ficam só nesta tela.</p></div></div>`;
  h += `<div class="ger-filtros panel">
    <label><span>Líder / time</span><select data-ger="time">${opt("","Todos os times",!G.time)}${times.map(t=>opt(t,t,t===G.time)).join("")}</select></label>
    <label><span>Vendedor</span><select data-ger="vend">${opt("","Todos os vendedores",!G.vend)}${vends.map(p=>opt(p.id,p.nome,p.id===G.vend)).join("")}</select></label>
    <label><span>Período de referência</span><select data-ger="ref">${Object.entries(GER_REF).map(([k,r])=>opt(k,r.l,k===G.ref)).join("")}</select></label>
    <label><span>Medida</span><select data-ger="met">${Object.entries(GER_MET).map(([k,l])=>opt(k,l,k===G.met)).join("")}</select></label>
    <button class="btn small" type="button" data-act="gerReset">Restaurar valores</button>
  </div>`;
  const semDados = !A.cli || A.semSerie===A.cli;
  if(semDados){
    h += `<div class="notice"><div><b>Ainda não há histórico mensal para esta carteira.</b> A série de faturamento e pedidos por cliente é gravada pelo robô do Qlik uma vez por dia (Actions › Sincronizar Qlik › "analisar"). Sem ela, os simuladores não calculam nada para não presumir valores.</div></div>`;
    return h;
  }
  const avisos = [];
  if(A.semSerie) avisos.push(`${A.semSerie} de ${A.cli} clientes sem histórico no Qlik ficaram fora das médias.`);
  if(G.met==="fat") avisos.push("A meta do Qlik é de pedidos; em faturamento ela é usada como referência. Ajuste o campo da meta se precisar.");
  avisos.push(`Histórico: ${refLbl} (${GER_REF[G.ref].l.toLowerCase()}). Realizado: ${mkLabel(CUR_MK)} até hoje${G.met==="ped"?" (pedidos de hora em hora)":` (faturamento do Qlik em ${fd(atual)})`}. Projetado: só simulação.`);

  // ---------- Simulador de crescimento ----------
  const gDe = c => G.gCli[c.cod]!=null ? G.gCli[c.cod] : (G.gVend[c.vend]!=null ? G.gVend[c.vend] : G.g);
  let projG = 0; lista.forEach(c=>{ const n = gerNum(c,G); if(n.ok) projG += n.ref*(1+gDe(c)/100); });
  // ---------- Simulador de meta ----------
  const falta = Math.max(0, meta - A.real);
  const cresc = A.ref ? meta/A.ref - 1 : null;
  const capCarteira = A.ref*(1+G.cap/100);
  const cobre = meta <= capCarteira;
  const gapExtra = Math.max(0, meta - capCarteira);
  const tNovo = G.tNovo!=null ? G.tNovo : (tk.tNovo||A.ticketCli||0);
  const tReat = G.tReat!=null ? G.tReat : (tk.tReat||A.ticketCli||0);
  const nNovos = tNovo ? Math.ceil(gapExtra*G.mixN/100/tNovo) : 0;
  const nReat = tReat ? Math.ceil(gapExtra*(100-G.mixN)/100/tReat) : 0;

  // ---------- Destaques ----------
  h += `<div class="kpi2-grid ger-kpis">
    ${gerTile("Meta mensal", money(meta), G.meta!=null?"digitada (simulação)":(metaQ?"soma das metas do Qlik":"sem meta no Qlik — digite abaixo"))}
    ${gerTile(`Realizado em ${MONTHS[TODAY.getMonth()].slice(0,3)}`, money(A.real), `${pctTxt(meta?A.real/meta:null)} da meta · ${nInt(A.npReal)} pedidos`)}
    ${gerTile("Falta para a meta", money(falta), falta?`${money(falta/Math.max(1,diasUteisRest(TODAY)))}/dia útil`:"meta atingida","hl")}
    ${gerTile("Crescimento necessário", pctTxt(cresc!=null?Math.max(0,cresc):null,1), cresc!=null&&cresc<0?`a média de ${refLbl} (${money(A.ref)}) já supera a meta`:`sobre a média de ${refLbl} (${money(A.ref)})`)}
    ${gerTile("Projeção simulada", money(projG), `crescimento de ${G.g}% na carteira`)}
    ${gerTile("Ticket médio usado", money(tNovo), `novos · reativação ${money(tReat)}`)}
    ${gerTile("Novos clientes estimados", nInt(nNovos), cobre?"não precisa: a carteira cobre":`para ${G.mixN}% do que falta`)}
    ${gerTile("Reativações estimadas", nInt(nReat), cobre?"não precisa: a carteira cobre":`de ${nInt(tk.poolInat)} inativos na carteira`)}
  </div>`;
  h += `<div class="ger-avisos">${avisos.map(a=>`<span>${a}</span>`).join("")}</div>`;

  // ---------- 1. Visão da carteira ----------
  const grupos = (chave) => { const m = new Map(); lista.forEach(c=>{ const p = person(c.vend); const k = chave(c,p); if(!m.has(k)) m.set(k, []); m.get(k).push(c); }); return m; };
  const porTime = grupos((c,p)=>p.time||"Sem time");
  const porVend = grupos(c=>c.vend);
  const liderDe = t => { const l = DB.people.find(p=>p.time===t && (p.papel==="lider" || p.acesso==="equipe")); return l ? l.nome : ""; };
  h += `<section class="panel ger-sec"><h2>1. Carteira <small>${GER_MET[G.met]} · média mensal de ${refLbl}</small></h2>
    <div class="kpi2-grid">
      ${gerTile("Clientes", nInt(A.cli), `${nInt(A.ativos)} ativos · ${nInt(A.risco)} inativam no mês · ${nInt(A.inativos)} inativos`)}
      ${gerTile("Reativados no mês", nInt(A.reat), `${nInt(A.novos)} clientes novos (1º faturamento) no mês`)}
      ${gerTile(`Média mensal de ${L}`, money(A.ref), `${nInt(A.np)} pedidos/mês`)}
      ${gerTile("Média por vendedor", money(A.vends.size?A.ref/A.vends.size:0), `${A.vends.size} vendedores`)}
      ${gerTile("Ticket médio", money(A.ticketCli), `por cliente comprador · ${money(A.ticketPed)} por pedido`)}
      ${gerTile("Potencial de crescimento", money(A.headroom), `voltar ao melhor mês de cada cliente${A.retomada?` · retomar 2025: ${money(A.retomada)}/mês`:""}`)}
    </div>
    <div class="table-wrap"><table class="ger-tab"><thead><tr><th>Líder / time</th><th class="r">Vendedores</th><th class="r">Clientes</th><th class="r">Ativos</th><th class="r">Inativos</th><th class="r">Reativados</th><th class="r">Média mensal</th><th class="r">Média/vendedor</th><th class="r">Pedidos/mês</th><th class="r">Ticket/cliente</th><th class="r">Realizado mês</th><th class="r">Potencial</th></tr></thead><tbody>
    ${Array.from(porTime).sort((a,b)=>gerAgg(b[1],G).ref-gerAgg(a[1],G).ref).map(([t,cs])=>{ const a = gerAgg(cs,G); return `<tr><td><b>${esc(t)}</b>${liderDe(t)?`<br><small>${esc(liderDe(t))}</small>`:""}</td><td class="r">${a.vends.size}</td><td class="r">${nInt(a.cli)}</td><td class="r">${nInt(a.ativos)}</td><td class="r">${nInt(a.inativos)}</td><td class="r">${nInt(a.reat)}</td><td class="r"><b>${money(a.ref)}</b></td><td class="r">${money(a.vends.size?a.ref/a.vends.size:0)}</td><td class="r">${nInt(a.np)}</td><td class="r">${money(a.ticketCli)}</td><td class="r">${money(a.real)}</td><td class="r">${money(a.headroom)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <details class="ger-det"><summary>Por vendedor</summary><div class="table-wrap"><table class="ger-tab"><thead><tr><th>Vendedor</th><th>Time</th><th class="r">Clientes</th><th class="r">Ativos</th><th class="r">Inativos</th><th class="r">Média mensal</th><th class="r">Pedidos/mês</th><th class="r">Ticket/cliente</th><th class="r">Realizado mês</th><th class="r">Potencial</th></tr></thead><tbody>
    ${Array.from(porVend).map(([v,cs])=>[v,cs,gerAgg(cs,G)]).sort((a,b)=>b[2].ref-a[2].ref).map(([v,cs,a])=>`<tr><td><b>${esc(nameOf(v))}</b></td><td>${esc((person(v)||{}).time||"")}</td><td class="r">${nInt(a.cli)}</td><td class="r">${nInt(a.ativos)}</td><td class="r">${nInt(a.inativos)}</td><td class="r"><b>${money(a.ref)}</b></td><td class="r">${nInt(a.np)}</td><td class="r">${money(a.ticketCli)}</td><td class="r">${money(a.real)}</td><td class="r">${money(a.headroom)}</td></tr>`).join("")}
    </tbody></table></div></details>
  </section>`;

  // ---------- 2. Simulador de crescimento ----------
  const clientesOrd = lista.map(c=>({c, n:gerNum(c,G)})).filter(x=>x.n.ok && x.n.ref>0).sort((a,b)=>b.n.ref-a.n.ref);
  h += `<section class="panel ger-sec"><h2>2. Simulador de crescimento</h2>
    <div class="ger-form"><label><span>Crescimento desejado da carteira (%)</span>${gerInput("g", G.g, 'step="0.5"')}</label>
      <div class="ger-res"><div><small>Base (${refLbl})</small><b>${money(A.ref)}</b></div><div><small>Projetado</small><b>${money(projG)}</b></div><div><small>Valor adicional</small><b class="ok">+${money(projG-A.ref)}</b></div><div><small>Ticket por cliente comprador</small><b>${money(A.ticketCli)} → ${money(A.compr?projG/A.compr:0)}</b></div></div></div>
    <div class="table-wrap"><table class="ger-tab"><thead><tr><th>Vendedor</th><th>Time</th><th class="r">Base</th><th class="r">% simulado</th><th class="r">Projetado</th><th class="r">Adicional</th><th class="r">Meta Qlik</th><th class="r">Projetado/meta</th></tr></thead><tbody>
    ${Array.from(porVend).map(([v,cs])=>{ let b=0,p=0; cs.forEach(c=>{ const n=gerNum(c,G); if(n.ok){ b+=n.ref; p+=n.ref*(1+gDe(c)/100); } }); const mq = metaQlikDe([v]); return {v,b,p,mq}; }).sort((a,b)=>b.b-a.b).map(r=>`<tr><td><b>${esc(nameOf(r.v))}</b></td><td>${esc((person(r.v)||{}).time||"")}</td><td class="r">${money(r.b)}</td><td class="r">${gerInput("gVend:"+r.v, G.gVend[r.v]!=null?G.gVend[r.v]:"", `placeholder="${G.g}" step="0.5"`)}</td><td class="r"><b>${money(r.p)}</b></td><td class="r">+${money(r.p-r.b)}</td><td class="r">${r.mq?money(r.mq):"—"}</td><td class="r">${r.mq?pctTxt(r.p/r.mq):"—"}</td></tr>`).join("")}
    </tbody></table></div>
    <details class="ger-det"><summary>Por cliente (os 30 maiores da carteira)</summary><div class="table-wrap"><table class="ger-tab"><thead><tr><th>Cliente</th><th>Vendedor</th><th class="r">Base</th><th class="r">% simulado</th><th class="r">Novo valor estimado</th></tr></thead><tbody>
    ${clientesOrd.slice(0,30).map(({c,n})=>`<tr><td><b>${esc(c.cli)}</b><br><small>Cód ${esc(c.cod)}</small></td><td>${esc(nameOf(c.vend))}</td><td class="r">${money(n.ref)}</td><td class="r">${gerInput("gCli:"+c.cod, G.gCli[c.cod]!=null?G.gCli[c.cod]:"", `placeholder="${G.gVend[c.vend]!=null?G.gVend[c.vend]:G.g}" step="0.5"`)}</td><td class="r"><b>${money(n.ref*(1+gDe(c)/100))}</b></td></tr>`).join("")}
    </tbody></table></div></details>
  </section>`;

  // ---------- 3. Simulador de meta ----------
  const inc = Math.max(0, meta - A.ref);
  // Distribuição do crescimento: proporcional à base (mesmo % para todos) ou ao potencial (quem já comprou mais e caiu).
  const linhas = clientesOrd.map(({c,n})=>{
    const head = Math.max(0, n.pico - n.ref);
    return { c, n, head };
  });
  const somaHead = linhas.reduce((a,l)=>a+l.head,0);
  linhas.forEach(l=>{ l.add = G.dist==="pot" && somaHead ? inc*l.head/somaHead : (A.ref ? inc*l.n.ref/A.ref : 0); l.gp = l.n.ref ? l.add/l.n.ref : null; l.part = inc ? l.add/inc : 0; });
  linhas.sort((a,b)=>b.add-a.add);
  const top10 = linhas.slice(0, Math.max(1, Math.ceil(linhas.length*0.1))).reduce((a,l)=>a+l.part,0);
  const top5n = linhas.slice(0,5).reduce((a,l)=>a+l.part,0);
  const alertas = [];
  if(cresc!=null && cresc*100 > G.cap) alertas.push(`O crescimento necessário (${pctTxt(cresc,1)}) passa do limite viável de ${G.cap}% para a carteira atual: complemente com novos clientes e reativações (seção 4).`);
  if(inc && top5n>0.35) alertas.push(`Concentração: só 5 clientes respondem por ${pctTxt(top5n)} do crescimento necessário. Diversifique as ações para não depender de poucos clientes.`);
  if(G.dist==="pot" && somaHead && inc>somaHead) alertas.push(`O potencial de recuperação da carteira (${money(somaHead)}) não cobre o crescimento necessário (${money(inc)}).`);
  h += `<section class="panel ger-sec"><h2>3. Simulador de meta mensal</h2>
    <div class="ger-form">
      <label><span>Meta do mês (${G.met==="ped"?"pedidos":"faturamento"}, R$)</span>${gerInput("meta", meta, 'step="1000"')}<span class="note">${metaQ?`Meta do Qlik para esta seleção: ${money(metaQ)}`:"Sem meta do Qlik para esta seleção."}</span></label>
      <label><span>Crescimento máximo viável da carteira atual (%)</span>${gerInput("cap", G.cap, 'step="1"')}</label>
      <label><span>Distribuir o crescimento</span><select data-ger="dist">${opt("prop","Igual para todos (proporcional à base)",G.dist==="prop")}${opt("pot","Pelo potencial (quem já comprou mais)",G.dist==="pot")}</select></label>
    </div>
    <div class="ger-res">
      <div><small>Realizado no mês</small><b>${money(A.real)}</b></div>
      <div><small>Falta para a meta</small><b>${money(falta)}</b></div>
      <div><small>Base de referência</small><b>${money(A.ref)}</b></div>
      <div><small>Crescimento necessário</small><b class="${cresc!=null&&cresc*100>G.cap?"neg":"ok"}">${pctTxt(cresc!=null?Math.max(0,cresc):null,1)}</b></div>
    </div>
    <div class="ger-verd ${cobre?"ok":"neg"}">${cobre
      ? `<b>A carteira atual cobre a meta</b> com ${pctTxt(Math.max(0,cresc),1)} de crescimento sobre a média de ${refLbl}.`
      : `<b>Só a carteira atual não cobre a meta.</b> Com o limite de ${G.cap}%, ela chega a ${money(capCarteira)}; faltam ${money(gapExtra)} vindos de clientes novos e reativações.`}</div>
    ${alertas.length?`<ul class="ger-alertas">${alertas.map(a=>`<li>⚠ ${a}</li>`).join("")}</ul>`:""}
    <details class="ger-det"${inc?" open":""}><summary>Crescimento necessário por cliente (os 25 que mais contribuem)</summary><div class="table-wrap"><table class="ger-tab"><thead><tr><th>Cliente</th><th>Vendedor</th><th class="r">Base</th><th class="r">Crescimento</th><th class="r">Novo valor estimado</th><th class="r">Participação</th></tr></thead><tbody>
    ${linhas.slice(0,25).map(l=>`<tr><td><b>${esc(l.c.cli)}</b><br><small>Cód ${esc(l.c.cod)}</small></td><td>${esc(nameOf(l.c.vend))}</td><td class="r">${money(l.n.ref)}</td><td class="r">${pctTxt(l.gp,1)}</td><td class="r"><b>${money(l.n.ref+l.add)}</b></td><td class="r">${pctTxt(l.part,1)}</td></tr>`).join("") || `<tr><td colspan="6" class="hint">A base já cobre a meta.</td></tr>`}
    </tbody></table></div></details>
  </section>`;

  // ---------- 4. Novos clientes e reativações ----------
  const estr = (nome, carteiraG, partN, partR) => {
    const vC = A.ref*(carteiraG/100); const rest = Math.max(0, meta - A.ref - vC);
    const nN = tNovo && partN ? Math.ceil(rest*partN/tNovo) : 0, nR = tReat && partR ? Math.ceil(rest*partR/tReat) : 0;
    const total = A.ref + vC + nN*tNovo + nR*tReat;
    return { nome, carteiraG, nN, nR, add: total - A.ref, pct: meta ? total/meta : null, total };
  };
  const combos = [
    estr(`Só carteira atual (${G.cap}%)`, G.cap, 0, 0),
    estr("Carteira + só clientes novos", G.cap, 1, 0),
    estr("Carteira + só reativações", G.cap, 0, 1),

      <label><span>Ticket mensal de cliente reativado (R$)</span>${gerInput("tReat", tReat, 'step="100"')}<span class="note">${tk.tReat?`Sugerido: ${money(tk.tReat)} (${tk.fonteR}).`:`Sem histórico de reativações nesta carteira: usando o ticket médio da carteira (${money(A.ticketCli)}) até você informar o valor.`}</span></label>

    ${combos.map(x=>`<tr><td><b>${x.nome}</b></td><td class="r">${x.carteiraG}%</td><td class="r">${nInt(x.nN)}</td><td class="r">${nInt(x.nR)}${x.nR>tk.poolInat?` <span class="chip warn">acima dos inativos</span>`:""}</td><td class="r">+${money(x.add)}</td><td class="r"><b>${money(x.total)}</b></td><td style="min-width:120px">${barraMeta(x.pct)}<small>${pctTxt(x.pct)}</small></td></tr>`).join("")}
    </tbody></table></div>
  </section>`;

  // ---------- 5. Cenários comparativos ----------
  const def = { cons:[0.01,0.02], real:[0.02,0.04], agre:[0.04,0.08] };
  const CEN = [["cons","Conservador"],["real","Realista"],["agre","Agressivo"]].map(([k,nome])=>{
    const c = G.cen[k]; const n = c.n!=null ? c.n : Math.ceil(A.ativos*def[k][0]); const r = c.r!=null ? c.r : Math.ceil(tk.poolInat*def[k][1]);
    const vCart = A.ref*c.g/100, vN = n*tNovo, vR = r*tReat; const total = A.ref + vCart + vN + vR; const dif = total - meta;
    const faltaN = dif<0 && tNovo ? Math.ceil(-dif/tNovo) : 0, faltaR = dif<0 && tReat ? Math.ceil(-dif/tReat) : 0;
    return { k, nome, g:c.g, n, r, vCart, vN, vR, total, dif, pct: meta? total/meta : null, faltaN, faltaR };
  });
  h += `<section class="panel ger-sec"><h2>5. Cenários comparativos <small>edite os números de cada cenário</small></h2>
    <div class="ger-cen">${CEN.map(c=>`<div class="ger-cen-c ${c.k}"><h3>${c.nome}</h3>
      <label><span>Crescimento da carteira (%)</span>${gerInput(`cen:${c.k}:g`, c.g, 'step="0.5"')}</label>
